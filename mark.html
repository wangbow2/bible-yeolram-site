<script>
const D=[{"n": 1, "q": "마가복음 1장 1절은 이 책을 무엇의 시작이라고 소개합니까?", "c": 1, "a": "하나님의 아들 예수 그리스도의 복음의 시작", "r": "막 1:1"}, {"n": 2, "q": "세례 요한이 광야에서 전파한 세례는 어떤 세례입니까?", "c": 1, "a": "죄 사함을 받게 하는 회개의 세례", "r": "막 1:4"}, {"n": 3, "q": "세례 요한의 옷차림과 음식은 무엇이었습니까?", "c": 1, "a": "낙타털 옷, 가죽 띠, 메뚜기와 석청", "r": "막 1:6"}, {"n": 4, "q": "요한은 자기 뒤에 오시는 이에 대해 자신이 무엇조차 감당하지 못하겠다고 했습니까?", "c": 1, "a": "굽혀 그의 신발끈을 푸는 것", "r": "막 1:7"}, {"n": 5, "q": "예수께서 물에서 올라오실 때 보신 두 가지는 무엇입니까?", "c": 1, "a": "하늘이 갈라짐, 성령이 비둘기 같이 내려오심", "r": "막 1:10"}, {"n": 6, "q": "광야에서 사십 일 동안 예수님은 누구와 함께 계셨고 누가 수종들었습니까?", "c": 1, "a": "들짐승과 함께 계셨고 천사들이 수종듦", "r": "막 1:13"}, {"n": 7, "q": "예수께서 갈릴리에서 처음 전파하신 말씀(1:15)은 무엇입니까?", "c": 1, "a": "때가 찼고 하나님의 나라가 가까이 왔으니 회개하고 복음을 믿으라", "r": "막 1:15"}, {"n": 8, "q": "야고보와 요한은 부르심을 받을 때 누구를 배에 버려 두고 따랐습니까?", "c": 1, "a": "아버지 세베대(품꾼들과 함께)", "r": "막 1:20"}, {"n": 9, "q": "가버나움 회당에서 사람들이 예수님의 교훈에 놀란 이유는 무엇입니까?", "c": 1, "a": "권위 있는 자와 같고 서기관들과 같지 아니하였기 때문", "r": "막 1:22"}, {"n": 10, "q": "열병이 떠난 시몬의 장모는 곧 무엇을 하였습니까?", "c": 1, "a": "그들에게 수종듦", "r": "막 1:31"}, {"n": 11, "q": "예수께서 새벽 아직 밝기 전에 한적한 곳에서 하신 일은 무엇입니까?", "c": 1, "a": "기도하심", "r": "막 1:35"}, {"n": 12, "q": "중풍병자를 메고 온 사람들은 무리 때문에 어떻게 하였습니까?", "c": 2, "a": "지붕을 뜯어 구멍을 내고 상을 달아 내림", "r": "막 2:4"}, {"n": 13, "q": "예수께서 중풍병자에게 처음 하신 말씀은 무엇입니까?", "c": 2, "a": "작은 자야 네 죄 사함을 받았느니라", "r": "막 2:5"}, {"n": 14, "q": "서기관들은 예수님의 죄 사함 선언을 속으로 무엇이라 생각했습니까?", "c": 2, "a": "신성 모독", "r": "막 2:7"}, {"n": 15, "q": "레위는 누구의 아들이며 부르심을 받을 때 어디에 앉아 있었습니까?", "c": 2, "a": "알패오의 아들, 세관", "r": "막 2:14"}, {"n": 16, "q": "예수께서 세리와 죄인들과 함께 잡수시는 이유를 무엇에 비유하셨습니까?", "c": 2, "a": "건강한 자에게는 의사가 쓸 데 없고 병든 자에게라야 쓸 데 있음", "r": "막 2:17"}, {"n": 17, "q": "예수님의 제자들이 금식하지 않는 이유를 예수님은 무엇에 비유하셨습니까?", "c": 2, "a": "혼인 집 손님들이 신랑과 함께 있을 때", "r": "막 2:19"}, {"n": 18, "q": "새 포도주는 어디에 넣어야 합니까?", "c": 2, "a": "새 부대", "r": "막 2:22"}, {"n": 19, "q": "제자들이 안식일에 밀밭 사이로 지나가며 한 일은 무엇입니까?", "c": 2, "a": "길을 열며 이삭을 자름", "r": "막 2:23"}, {"n": 20, "q": "다윗이 진설병을 먹은 것은 어느 대제사장 때입니까?", "c": 2, "a": "아비아달 대제사장 때", "r": "막 2:26"}, {"n": 21, "q": "2장 27-28절에서 안식일에 대해 예수께서 하신 말씀은 무엇입니까?", "c": 2, "a": "안식일이 사람을 위하여 있는 것이요 사람이 안식일을 위하여 있는 것이 아님, 인자는 안식일에도 주인임", "r": "막 2:27-28"}, {"n": 22, "q": "회당에 있던 병자는 어떤 사람이었습니까?", "c": 3, "a": "한쪽 손 마른 사람", "r": "막 3:1"}, {"n": 23, "q": "손 마른 사람을 고치시기 전에 예수께서 물으신 질문은 무엇입니까?", "c": 3, "a": "안식일에 선을 행하는 것과 악을 행하는 것, 생명을 구하는 것과 죽이는 것, 어느 것이 옳으냐", "r": "막 3:4"}, {"n": 24, "q": "바리새인들은 누구와 함께 예수를 죽일 것을 의논하였습니까?", "c": 3, "a": "헤롯당", "r": "막 3:6"}, {"n": 25, "q": "예수께서 무리를 피하기 위해 제자들에게 대기하도록 명하신 것은 무엇입니까?", "c": 3, "a": "작은 배", "r": "막 3:9"}, {"n": 26, "q": "예수께서 열둘을 세우신 목적 세 가지는 무엇입니까?", "c": 3, "a": "자기와 함께 있게 하고, 보내어 전도하게 하고, 귀신을 내쫓는 권능을 가지게 하려고", "r": "막 3:14-15"}, {"n": 27, "q": "야고보와 요한에게 더하신 이름과 그 뜻은 무엇입니까?", "c": 3, "a": "보아너게, 우레의 아들", "r": "막 3:17"}, {"n": 28, "q": "예수님의 친족들이 그를 붙들러 나온 이유는 무엇입니까?", "c": 3, "a": "그가 미쳤다 하므로", "r": "막 3:21"}, {"n": 29, "q": "예루살렘에서 내려온 서기관들은 예수님이 누가 지폈다고 했습니까?", "c": 3, "a": "바알세불", "r": "막 3:22"}, {"n": 30, "q": "영원히 사하심을 얻지 못하는 죄는 무엇입니까?", "c": 3, "a": "성령을 모독하는 것", "r": "막 3:29"}, {"n": 31, "q": "예수께서 말씀하신 참 가족은 누구입니까?", "c": 3, "a": "하나님의 뜻대로 행하는 자", "r": "막 3:35"}, {"n": 32, "q": "씨 뿌리는 비유에서 돌밭에 떨어진 씨가 마른 이유는 무엇입니까?", "c": 4, "a": "흙이 깊지 않아 뿌리가 없으므로", "r": "막 4:5-6"}, {"n": 33, "q": "좋은 땅에 떨어진 씨는 몇 배의 결실을 하였습니까?", "c": 4, "a": "삼십 배, 육십 배, 백 배", "r": "막 4:8"}, {"n": 34, "q": "길 가에 뿌려진 말씀은 누가 즉시 와서 빼앗아 갑니까?", "c": 4, "a": "사탄", "r": "막 4:15"}, {"n": 35, "q": "가시떨기에 뿌려진 자에게 말씀을 막는 세 가지는 무엇입니까?", "c": 4, "a": "세상의 염려, 재물의 유혹, 기타 욕심", "r": "막 4:19"}, {"n": 36, "q": "등불은 어디에 두는 것이라고 하셨습니까?", "c": 4, "a": "등경 위", "r": "막 4:21"}, {"n": 37, "q": "\"있는 자는 받을 것이요 없는 자는 (       )\" 빈칸에 들어갈 말은?", "c": 4, "a": "그 있는 것까지도 빼앗기리라", "r": "막 4:25"}, {"n": 38, "q": "스스로 자라는 씨 비유에서 땅이 열매 맺는 순서는 무엇입니까?", "c": 4, "a": "싹, 이삭, 이삭에 충실한 곡식", "r": "막 4:28"}, {"n": 39, "q": "겨자씨는 심긴 후 어떻게 됩니까?", "c": 4, "a": "모든 풀보다 커지고 큰 가지를 내어 공중의 새들이 깃들임", "r": "막 4:32"}, {"n": 40, "q": "광풍이 일 때 예수께서는 배의 어디에서 무엇을 하고 계셨습니까?", "c": 4, "a": "고물에서 베개를 베고 주무심", "r": "막 4:38"}, {"n": 41, "q": "예수께서 바다를 향하여 하신 말씀은 무엇입니까?", "c": 4, "a": "잠잠하라 고요하라", "r": "막 4:39"}, {"n": 42, "q": "바다를 잔잔하게 하신 것을 본 제자들은 서로 무엇이라고 말했습니까?", "c": 4, "a": "그가 누구이기에 바람과 바다도 순종하는가", "r": "막 4:41"}, {"n": 43, "q": "예수께서 바다 건너편 어느 지방에 이르셨습니까?", "c": 5, "a": "거라사인의 지방", "r": "막 5:1"}, {"n": 44, "q": "더러운 귀신 들린 사람은 어디에 거처하였습니까?", "c": 5, "a": "무덤 사이", "r": "막 5:3"}, {"n": 45, "q": "귀신 들린 사람은 자기 이름을 무엇이라 했으며 그 이유는?", "c": 5, "a": "군대, 우리가 많음이니이다", "r": "막 5:9"}, {"n": 46, "q": "귀신들이 들어간 돼지 떼는 약 몇 마리였습니까?", "c": 5, "a": "거의 이천 마리", "r": "막 5:13"}, {"n": 47, "q": "고침 받은 사람은 예수님과 함께 있기를 원했으나 예수님은 무엇을 하라고 하셨습니까?", "c": 5, "a": "집으로 돌아가 주께서 행하신 큰 일을 가족에게 알리라", "r": "막 5:19"}, {"n": 48, "q": "고침 받은 사람은 어디에 전파했습니까?", "c": 5, "a": "데가볼리", "r": "막 5:20"}, {"n": 49, "q": "야이로는 어떤 사람이었습니까?", "c": 5, "a": "회당장 중의 하나", "r": "막 5:22"}, {"n": 50, "q": "혈루증 앓던 여자는 몇 년 동안 앓았습니까?", "c": 5, "a": "열두 해", "r": "막 5:25"}, {"n": 51, "q": "혈루증 앓던 여자는 무엇을 생각하며 예수님의 옷에 손을 댔습니까?", "c": 5, "a": "그의 옷에만 손을 대어도 구원을 받으리라", "r": "막 5:28"}, {"n": 52, "q": "딸이 죽었다는 소식을 들은 회당장에게 예수께서 하신 말씀은 무엇입니까?", "c": 5, "a": "두려워하지 말고 믿기만 하라", "r": "막 5:36"}, {"n": 53, "q": "\"달리다굼\"의 뜻은 무엇이며 소녀의 나이는 몇 살이었습니까?", "c": 5, "a": "소녀야 일어나라, 열두 살", "r": "막 5:41-42"}, {"n": 54, "q": "고향 사람들은 예수님을 누구의 아들, 무슨 직업이라 했습니까?", "c": 6, "a": "마리아의 아들 목수", "r": "막 6:3"}, {"n": 55, "q": "6장 3절에 나오는 예수님의 형제 네 사람은 누구입니까?", "c": 6, "a": "야고보, 요셉, 유다, 시몬", "r": "막 6:3"}, {"n": 56, "q": "예수께서 고향에서 무엇을 이상히 여기셨습니까?", "c": 6, "a": "그들이 믿지 않음", "r": "막 6:6"}, {"n": 57, "q": "열두 제자를 보내실 때 가지고 가도 되는 것은 무엇입니까?", "c": 6, "a": "지팡이(신만 신음)", "r": "막 6:8-9"}, {"n": 58, "q": "영접하지 않는 곳을 떠날 때 어떻게 하라고 하셨습니까?", "c": 6, "a": "발 아래 먼지를 떨어버려 증거를 삼으라", "r": "막 6:11"}, {"n": 59, "q": "제자들은 나가서 병자에게 무엇을 발라 고쳤습니까?", "c": 6, "a": "기름", "r": "막 6:13"}, {"n": 60, "q": "헤롯이 요한을 옥에 가둔 이유는 무엇입니까?", "c": 6, "a": "동생 빌립의 아내 헤로디아에게 장가 든 것을 요한이 옳지 않다고 했기 때문", "r": "막 6:17-18"}, {"n": 61, "q": "헤롯은 요한을 어떤 사람으로 알았습니까?", "c": 6, "a": "의롭고 거룩한 사람", "r": "막 6:20"}, {"n": 62, "q": "헤롯은 춤 춘 소녀에게 무엇까지라도 주겠다고 맹세했습니까?", "c": 6, "a": "나라의 절반", "r": "막 6:23"}, {"n": 63, "q": "오천 명을 먹이시기 전 제자들은 얼마어치 떡을 사다 먹이자고 했습니까?", "c": 6, "a": "이백 데나리온", "r": "막 6:37"}, {"n": 64, "q": "오병이어 때 사람들은 몇 명씩 떼를 지어 어디에 앉았습니까?", "c": 6, "a": "백 명씩 또는 오십 명씩, 푸른 잔디 위", "r": "막 6:39-40"}, {"n": 65, "q": "예수께서 바다 위로 걸어 오신 때는 밤 몇 경쯤입니까?", "c": 6, "a": "밤 사경쯤", "r": "막 6:48"}, {"n": 66, "q": "바다 위로 걸어오시는 예수님을 보고 제자들은 무엇이라 생각했습니까?", "c": 6, "a": "유령", "r": "막 6:49"}, {"n": 67, "q": "바리새인들과 모든 유대인들이 지킨 장로들의 전통은 어떤 것이었습니까?", "c": 7, "a": "손을 잘 씻지 않고서는 음식을 먹지 않는 것", "r": "막 7:3"}, {"n": 68, "q": "예수께서 이사야의 예언을 인용하여 이 백성이 입술로는 공경하나 무엇은 멀다고 하셨습니까?", "c": 7, "a": "마음", "r": "막 7:6"}, {"n": 69, "q": "\"고르반\"은 무슨 뜻입니까?", "c": 7, "a": "하나님께 드림", "r": "막 7:11"}, {"n": 70, "q": "예수께서 모든 음식물을 깨끗하다 하신 이유는 무엇입니까?", "c": 7, "a": "마음으로 들어가지 않고 배로 들어가 뒤로 나가기 때문", "r": "막 7:19"}, {"n": 71, "q": "사람의 마음에서 나오는 악한 생각 중 맨 처음 나오는 네 가지는?", "c": 7, "a": "음란, 도둑질, 살인, 간음", "r": "막 7:21-22"}, {"n": 72, "q": "딸에게서 귀신 쫓아 주시기를 간구한 여자는 어떤 사람이었습니까?", "c": 7, "a": "헬라인, 수로보니게 족속", "r": "막 7:26"}, {"n": 73, "q": "그 여자가 예수께 드린 대답은 무엇입니까?", "c": 7, "a": "상 아래 개들도 아이들이 먹던 부스러기를 먹나이다", "r": "막 7:28"}, {"n": 74, "q": "귀 먹고 말 더듬는 자를 고치실 때 예수께서 하신 행동은 무엇입니까?", "c": 7, "a": "손가락을 양 귀에 넣고 침을 뱉어 혀에 손을 대심", "r": "막 7:33"}, {"n": 75, "q": "귀 먹고 말 더듬는 자에게 하신 \"에바다\"의 뜻은 무엇입니까?", "c": 7, "a": "열리라", "r": "막 7:34"}, {"n": 76, "q": "사람들이 놀라 \"그가 모든 것을 잘하였도다\" 하며 무엇이라 했습니까?", "c": 7, "a": "못 듣는 사람도 듣게 하고 말 못하는 사람도 말하게 한다", "r": "막 7:37"}, {"n": 77, "q": "사천 명을 먹이실 때 무리가 예수님과 함께 있은 지 며칠이 지났습니까?", "c": 8, "a": "사흘", "r": "막 8:2"}, {"n": 78, "q": "사천 명을 먹이실 때 떡은 몇 개였고 남은 조각은 몇 광주리였습니까?", "c": 8, "a": "떡 일곱 개, 일곱 광주리", "r": "막 8:6,8"}, {"n": 79, "q": "사천 명을 먹이신 후 예수님과 제자들이 배로 간 지방은 어디입니까?", "c": 8, "a": "달마누다 지방", "r": "막 8:10"}, {"n": 80, "q": "제자들이 떡 가져오기를 잊었을 때 배에 떡이 몇 개 있었습니까?", "c": 8, "a": "한 개", "r": "막 8:14"}, {"n": 81, "q": "예수께서 제자들에게 주의하라고 경고하신 두 가지 누룩은 무엇입니까?", "c": 8, "a": "바리새인들의 누룩과 헤롯의 누룩", "r": "막 8:15"}, {"n": 82, "q": "벳새다의 맹인이 처음 안수 받은 후 본 것은 무엇입니까?", "c": 8, "a": "나무 같은 것들이 걸어 가는 것", "r": "막 8:24"}, {"n": 83, "q": "\"너희는 나를 누구라 하느냐\"고 물으신 곳은 어디입니까?", "c": 8, "a": "빌립보 가이사랴 여러 마을로 가는 길", "r": "막 8:27"}, {"n": 84, "q": "베드로의 신앙고백은 무엇입니까?", "c": 8, "a": "주는 그리스도시니이다", "r": "막 8:29"}, {"n": 85, "q": "예수께서 베드로를 꾸짖으신 이유는 무엇입니까?", "c": 8, "a": "하나님의 일을 생각하지 않고 사람의 일을 생각했기 때문", "r": "막 8:33"}, {"n": 86, "q": "예수님을 따라오려는 자가 해야 할 세 가지는 무엇입니까?", "c": 8, "a": "자기를 부인하고 자기 십자가를 지고 나를 따르는 것", "r": "막 8:34"}, {"n": 87, "q": "\"사람이 만일 온 천하를 얻고도 (         ) 무엇이 유익하리요\" 빈칸은?", "c": 8, "a": "자기 목숨을 잃으면", "r": "막 8:36"}, {"n": 88, "q": "예수께서 변형되실 때 데리고 가신 세 제자는 누구입니까?", "c": 9, "a": "베드로, 야고보, 요한", "r": "막 9:2"}, {"n": 89, "q": "변화산에서 예수님과 더불어 말한 두 사람은 누구입니까?", "c": 9, "a": "엘리야와 모세", "r": "막 9:4"}, {"n": 90, "q": "베드로가 변화산에서 짓자고 한 것은 무엇입니까?", "c": 9, "a": "초막 셋(주, 모세, 엘리야를 위하여)", "r": "막 9:5"}, {"n": 91, "q": "구름 속에서 난 소리는 무엇이라고 하였습니까?", "c": 9, "a": "이는 내 사랑하는 아들이니 너희는 그의 말을 들으라", "r": "막 9:7"}, {"n": 92, "q": "귀신 들린 아이의 아버지는 아이가 언제부터 그렇게 되었다고 했습니까?", "c": 9, "a": "어릴 때부터", "r": "막 9:21"}, {"n": 93, "q": "\"할 수 있거든\"이라는 아버지에게 예수께서 하신 말씀은 무엇입니까?", "c": 9, "a": "믿는 자에게는 능히 하지 못할 일이 없느니라", "r": "막 9:23"}, {"n": 94, "q": "아이의 아버지는 소리를 질러 무엇이라고 고백했습니까?", "c": 9, "a": "내가 믿나이다 나의 믿음 없는 것을 도와 주소서", "r": "막 9:24"}, {"n": 95, "q": "제자들이 귀신을 쫓아내지 못한 이유에 대해 예수께서 하신 말씀은 무엇입니까?", "c": 9, "a": "기도 외에 다른 것으로는 이런 종류가 나갈 수 없음", "r": "막 9:29"}, {"n": 96, "q": "제자들이 길에서 쟁론한 내용은 무엇입니까?", "c": 9, "a": "누가 크냐", "r": "막 9:34"}, {"n": 97, "q": "누구든지 첫째가 되고자 하면 어떻게 되어야 합니까?", "c": 9, "a": "뭇 사람의 끝이 되며 뭇 사람을 섬기는 자", "r": "막 9:35"}, {"n": 98, "q": "작은 자 하나라도 실족하게 하는 것보다 차라리 나은 것은 무엇입니까?", "c": 9, "a": "연자맷돌이 목에 매여 바다에 던져지는 것", "r": "막 9:42"}, {"n": 99, "q": "바리새인들이 이혼에 대해 묻자 모세가 무엇을 허락하였다고 대답했습니까?", "c": 10, "a": "이혼 증서를 써주어 버리기를 허락함", "r": "막 10:4"}, {"n": 100, "q": "모세가 이혼 명령을 기록한 이유는 무엇이라고 하셨습니까?", "c": 10, "a": "마음이 완악함으로 말미암아", "r": "막 10:5"}, {"n": 101, "q": "\"하나님이 짝지어 주신 것을 (      )\" 빈칸은?", "c": 10, "a": "사람이 나누지 못할지니라", "r": "막 10:9"}, {"n": 102, "q": "제자들이 어린 아이들을 데리고 오는 사람들을 꾸짖을 때 예수님의 반응은 무엇입니까?", "c": 10, "a": "노하시어 용납하고 금하지 말라고 하심", "r": "막 10:14"}, {"n": 103, "q": "영생을 물은 사람에게 예수께서 부족한 한 가지라며 하라고 하신 것은 무엇입니까?", "c": 10, "a": "가서 있는 것을 다 팔아 가난한 자들에게 주고 와서 나를 따르라", "r": "막 10:21"}, {"n": 104, "q": "부자가 하나님의 나라에 들어가는 것보다 무엇이 더 쉽다고 하셨습니까?", "c": 10, "a": "낙타가 바늘귀로 나가는 것", "r": "막 10:25"}, {"n": 105, "q": "예수님과 복음을 위하여 버린 자가 현세에 백 배로 받을 때 함께 받는 것은 무엇입니까?", "c": 10, "a": "박해", "r": "막 10:30"}, {"n": 106, "q": "야고보와 요한이 주께 구한 것은 무엇입니까?", "c": 10, "a": "주의 영광중에 하나는 우편, 하나는 좌편에 앉게 해 달라는 것", "r": "막 10:37"}, {"n": 107, "q": "10장 45절에서 인자가 온 목적은 무엇입니까?", "c": 10, "a": "섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함", "r": "막 10:45"}, {"n": 108, "q": "여리고의 맹인 거지는 누구이며 누구의 아들입니까?", "c": 10, "a": "바디매오, 디매오의 아들", "r": "막 10:46"}, {"n": 109, "q": "바디매오가 예수께 나아올 때 무엇을 내버렸습니까?", "c": 10, "a": "겉옷", "r": "막 10:50"}, {"n": 110, "q": "예수께서 예루살렘 가까이 이르신 감람 산 근처 두 마을은 어디입니까?", "c": 11, "a": "벳바게와 베다니", "r": "막 11:1"}, {"n": 111, "q": "제자들에게 끌고 오라고 하신 나귀 새끼는 어떤 것이었습니까?", "c": 11, "a": "아직 아무도 타 보지 않은 나귀 새끼", "r": "막 11:2"}, {"n": 112, "q": "누가 나귀 새끼를 왜 푸느냐고 묻거든 무엇이라 대답하라고 하셨습니까?", "c": 11, "a": "주가 쓰시겠다", "r": "막 11:3"}, {"n": 113, "q": "예수께서 예루살렘에 들어가실 때 무리가 외친 말은 무엇입니까?", "c": 11, "a": "호산나 찬송하리로다 주의 이름으로 오시는 이여", "r": "막 11:9"}, {"n": 114, "q": "무화과나무에 열매가 없었던 이유를 성경은 무엇이라고 설명합니까?", "c": 11, "a": "무화과의 때가 아니었기 때문", "r": "막 11:13"}, {"n": 115, "q": "성전에서 예수께서 둘러 엎으신 것은 무엇입니까?", "c": 11, "a": "돈 바꾸는 자들의 상과 비둘기 파는 자들의 의자", "r": "막 11:15"}, {"n": 116, "q": "예수께서 인용하신 \"내 집은 (      )이라 칭함을 받으리라\" 빈칸은?", "c": 11, "a": "만민이 기도하는 집", "r": "막 11:17"}, {"n": 117, "q": "다음 날 아침 무화과나무는 어떻게 되어 있었습니까?", "c": 11, "a": "뿌리째 말라 있었음", "r": "막 11:20"}, {"n": 118, "q": "기도하고 구하는 것에 대하여 어떻게 믿으라고 하셨습니까?", "c": 11, "a": "받은 줄로 믿으라", "r": "막 11:24"}, {"n": 119, "q": "서서 기도할 때 아무에게나 혐의가 있으면 어떻게 하라고 하셨습니까?", "c": 11, "a": "용서하라", "r": "막 11:25"}, {"n": 120, "q": "예수께서 권위에 대한 질문에 되물으신 것은 무엇입니까?", "c": 11, "a": "요한의 세례가 하늘로부터냐 사람으로부터냐", "r": "막 11:30"}, {"n": 121, "q": "포도원 주인이 마지막으로 보낸 자는 누구였습니까?", "c": 12, "a": "사랑하는 아들", "r": "막 12:6"}, {"n": 122, "q": "농부들이 아들을 죽인 이유는 무엇입니까?", "c": 12, "a": "상속자를 죽이면 유산이 자기들 것이 되리라 생각했기 때문", "r": "막 12:7"}, {"n": 123, "q": "예수께서 인용하신 시편 말씀에서 건축자들이 버린 돌은 무엇이 되었습니까?", "c": 12, "a": "모퉁이의 머릿돌", "r": "막 12:10"}, {"n": 124, "q": "세금 문제로 예수님을 책잡으려고 보낸 사람들은 누구입니까?", "c": 12, "a": "바리새인과 헤롯당 중의 사람들", "r": "막 12:13"}, {"n": 125, "q": "예수께서 세금 문제에 대해 하신 대답은 무엇입니까?", "c": 12, "a": "가이사의 것은 가이사에게, 하나님의 것은 하나님께 바치라", "r": "막 12:17"}, {"n": 126, "q": "부활 문제를 가지고 온 사두개인들은 부활에 대해 어떤 입장이었습니까?", "c": 12, "a": "부활이 없다고 함", "r": "막 12:18"}, {"n": 127, "q": "사두개인들의 오해의 원인을 예수께서 무엇이라 하셨습니까?", "c": 12, "a": "성경도 하나님의 능력도 알지 못하므로", "r": "막 12:24"}, {"n": 128, "q": "\"하나님은 죽은 자의 하나님이 아니요 (      )\" 빈칸은?", "c": 12, "a": "산 자의 하나님이시라", "r": "막 12:27"}, {"n": 129, "q": "지혜 있게 대답한 서기관에게 예수께서 하신 말씀은 무엇입니까?", "c": 12, "a": "네가 하나님의 나라에서 멀지 않도다", "r": "막 12:34"}, {"n": 130, "q": "예수께서 삼가라고 하신 서기관들이 원하는 것 네 가지는 무엇입니까?", "c": 12, "a": "긴 옷 입고 다니는 것, 시장에서 문안 받는 것, 회당의 높은 자리, 잔치의 윗자리", "r": "막 12:38-39"}, {"n": 131, "q": "가난한 과부가 헌금함에 넣은 것은 얼마입니까?", "c": 12, "a": "두 렙돈 곧 한 고드란트", "r": "막 12:42"}, {"n": 132, "q": "성전 건물을 보며 예수께서 하신 예언은 무엇입니까?", "c": 13, "a": "돌 하나도 돌 위에 남지 않고 다 무너뜨려지리라", "r": "막 13:2"}, {"n": 133, "q": "감람 산에서 예수께 조용히 질문한 네 제자는 누구입니까?", "c": 13, "a": "베드로, 야고보, 요한, 안드레", "r": "막 13:3"}, {"n": 134, "q": "난리와 난리의 소문을 들을 때 어떻게 하라고 하셨습니까?", "c": 13, "a": "두려워하지 말라(아직 끝은 아님)", "r": "막 13:7"}, {"n": 135, "q": "지진과 기근은 무엇의 시작이라고 하셨습니까?", "c": 13, "a": "재난의 시작", "r": "막 13:8"}, {"n": 136, "q": "끝이 오기 전에 먼저 이루어져야 할 일은 무엇입니까?", "c": 13, "a": "복음이 먼저 만국에 전파되어야 함", "r": "막 13:10"}, {"n": 137, "q": "끌려가 넘겨질 때 미리 염려하지 말아야 하는 이유는 무엇입니까?", "c": 13, "a": "말하는 이는 너희가 아니요 성령이시기 때문", "r": "막 13:11"}, {"n": 138, "q": "\"끝까지 견디는 자는 (      )\" 빈칸은?", "c": 13, "a": "구원을 받으리라", "r": "막 13:13"}, {"n": 139, "q": "멸망의 가증한 것이 선 것을 보면 유대에 있는 자들은 어디로 도망해야 합니까?", "c": 13, "a": "산", "r": "막 13:14"}, {"n": 140, "q": "이 일이 언제 일어나지 않도록 기도하라고 하셨습니까?", "c": 13, "a": "겨울", "r": "막 13:18"}, {"n": 141, "q": "무화과나무의 가지가 연하여지고 잎사귀를 내면 무엇이 가까운 줄 압니까?", "c": 13, "a": "여름", "r": "막 13:28"}, {"n": 142, "q": "\"천지는 없어지겠으나 (      )\" 빈칸은?", "c": 13, "a": "내 말은 없어지지 아니하리라", "r": "막 13:31"}, {"n": 143, "q": "그 날과 그 때는 누가 아십니까?", "c": 13, "a": "아버지만 아심(천사들도 아들도 모름)", "r": "막 13:32"}, {"n": 144, "q": "집 주인이 올 수 있는 네 때는 언제라고 하셨습니까?", "c": 13, "a": "저물 때, 밤중, 닭 울 때, 새벽", "r": "막 13:35"}, {"n": 145, "q": "대제사장들이 명절에는 예수를 잡지 말자고 한 이유는 무엇입니까?", "c": 14, "a": "민란이 날까 하여", "r": "막 14:2"}, {"n": 146, "q": "여인이 예수님께 향유를 부은 곳은 누구의 집입니까?", "c": 14, "a": "베다니 나병환자 시몬의 집", "r": "막 14:3"}, {"n": 147, "q": "여인이 부은 향유는 무엇이었으며 사람들은 얼마에 팔 수 있었다고 했습니까?", "c": 14, "a": "순전한 나드 한 옥합, 삼백 데나리온 이상", "r": "막 14:3,5"}, {"n": 148, "q": "예수께서는 여인이 향유를 부은 일을 무엇을 미리 준비한 것이라고 하셨습니까?", "c": 14, "a": "장례", "r": "막 14:8"}, {"n": 149, "q": "유월절 음식을 준비하러 간 제자들이 성내에서 만나게 될 사람은 어떤 사람입니까?", "c": 14, "a": "물 한 동이를 가지고 가는 사람", "r": "막 14:13"}, {"n": 150, "q": "유월절을 준비할 장소로 집 주인이 보여 줄 곳은 어디입니까?", "c": 14, "a": "자리를 펴고 준비한 큰 다락방", "r": "막 14:15"}, {"n": 151, "q": "예수를 팔 자에 대하여 예수께서 무엇이라 설명하셨습니까?", "c": 14, "a": "열둘 중의 하나 곧 나와 함께 그릇에 손을 넣는 자", "r": "막 14:20"}, {"n": 152, "q": "잔을 주시며 하신 말씀은 무엇입니까?", "c": 14, "a": "이것은 많은 사람을 위하여 흘리는 나의 피 곧 언약의 피니라", "r": "막 14:24"}, {"n": 153, "q": "예수께서는 베드로가 닭이 몇 번 울기 전에 몇 번 부인할 것이라 하셨습니까?", "c": 14, "a": "닭이 두 번 울기 전에 세 번", "r": "막 14:30"}, {"n": 154, "q": "겟세마네에서 예수께서 하나님을 부르신 호칭은 무엇입니까?", "c": 14, "a": "아빠 아버지", "r": "막 14:36"}, {"n": 155, "q": "예수께서 잠든 제자들에게 하신 말씀 \"마음에는 원이로되 (      )\" 빈칸은?", "c": 14, "a": "육신이 약하도다", "r": "막 14:38"}, {"n": 156, "q": "유다가 무리와 짠 군호는 무엇입니까?", "c": 14, "a": "입맞추는 자가 그이니 잡으라", "r": "막 14:44"}, {"n": 157, "q": "예수님이 잡히실 때 베 홑이불을 버리고 벗은 몸으로 도망한 사람은 누구입니까?", "c": 14, "a": "한 청년", "r": "막 14:51-52"}, {"n": 158, "q": "거짓 증인들은 예수께서 성전에 대해 무엇이라 말했다고 증언했습니까?", "c": 14, "a": "손으로 지은 성전을 헐고 ": 178, "q": "부활하신 예수께서 먼저 보이신 막달라 마리아는 어떤 여인이었습니까?", "c": 16, "a": "전에 일곱 귀신을 쫓아내어 주신 여인", "r": "막 16:9"}, {"n": 179, "q": "열한 제자에게 나타나신 예수께서 꾸짖으신 두 가지는 무엇입니까?", "c": 16, "a": "믿음 없는 것과 마음이 완악한 것", "r": "막 16:14"}, {"n": 180, "q": "예수께서 제자들에게 주신 명령(16:15)은 무엇입니까?", "c": 16, "a": "온 천하에 다니며 만민에게 복음을 전파하라", "r": "막 16:15"}, {"n": 181, "q": "믿는 자들에게 따르는 표적을 몇 가지 말해 보십시오.", "c": 16, "a": "귀신을 쫓아냄, 새 방언, 뱀을 집어올림, 독을 마셔도 해를 받지 않음, 병든 사람에게 손을 얹으면 나음", "r": "막 16:17-18"}, {"n": 182, "q": "말씀을 마치신 후 예수께서는 어떻게 되셨습니까?", "c": 16, "a": "하늘로 올려지사 하나님 우편에 앉으심", "r": "막 16:19"}];
const m=document.getElementById('m');let sec=null,cur=0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
D.forEach(d=>{if(d.c!==cur){cur=d.c;sec=document.createElement('section');sec.className='sec';sec.id='c'+d.c;sec.innerHTML='<h2>마가복음 '+d.c+'장</h2>';m.appendChild(sec)}
 const q=document.createElement('div');q.className='q';
 q.innerHTML='<div class="qt"><b>'+d.n+'.</b>'+esc(d.q)+' <small>('+d.c+'장)</small></div><div class="a hid"><span>'+esc(d.a)+'<span class="r">('+d.r+')</span></span></div>';
 const a=q.querySelector('.a');a.onclick=()=>{set(a,a.classList.contains('hid'));stat()};sec.appendChild(q)});
function set(e,s){e.classList.toggle('hid',!s);e.classList.toggle('show',s)}
function stat(){document.getElementById('stat').textContent='정답 공개 '+document.querySelectorAll('.a.show').length+' / '+D.length}
document.getElementById('hideAll').onclick=()=>{document.querySelectorAll('.a').forEach(e=>set(e,false));stat()};
document.getElementById('showAll').onclick=()=>{document.querySelectorAll('.a').forEach(e=>set(e,true));stat()};
document.getElementById('jump').onchange=e=>{if(e.target.value)document.getElementById(e.target.value).scrollIntoView()};
stat();
</script>
