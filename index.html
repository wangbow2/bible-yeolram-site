<style>
:root{--bg:#e7e4de;--bar:#23262b;--barfg:#fff;--paper:#fff;--red:#d40808;--refc:#a33;--hidbg:#c9d6ea;--hidfg:#2f4b78;--hidbd:#6d87b3;--showbg:rgba(255,255,255,.88);--muted:#999;--btn:#f4f4f4;--btnfg:#222}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1d20;--bar:#0f1113;--barfg:#eee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d20;--bar:#0f1113;--barfg:#eee;color-scheme:dark}
body{margin:0;background:var(--bg);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
header{position:sticky;top:env(safe-area-inset-top,0px);color:var(--barfg);padding-left:max(16px,env(safe-area-inset-left,0px))!important;padding-right:max(16px,env(safe-area-inset-right,0px))!important;z-index:10;background:var(--bar);display:flex;gap:10px;align-items:center;padding:8px 16px;flex-wrap:wrap}
header b{font-size:15px;margin-right:8px}
header button,header select{background:var(--btn);color:var(--btnfg);font-size:14px;padding:6px 10px;border-radius:6px;border:0;cursor:pointer}
header .stat{font-size:13px;opacity:.8;margin-left:auto}
main{max-width:900px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pg{position:relative;margin:0 auto 18px;background:var(--paper);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pg img{width:100%;display:block}
.pg .no{position:absolute;right:8px;top:6px;font-size:12px;color:var(--muted)}
.ans{position:absolute;transform:translateY(-100%);cursor:pointer;font-size:clamp(10px,1.55vw,14px);line-height:1.25;max-width:78%;border-radius:4px;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.ans.hid{background:var(--hidbg);color:var(--hidfg);border:1px dashed var(--hidbd)}
.ans.hid::before{content:"▶ 눌러서 정답 보기"}
.ans.hid span{display:none}
.ans.show{color:var(--red);background:var(--showbg);white-space:normal;font-weight:600}
.ans.show::before{content:"▶ "}
.ans .ref{font-weight:400;color:var(--refc);font-size:.85em;margin-left:4px}
.pgbtn{position:absolute;left:8px;top:6px;font-size:12px;padding:3px 8px;border-radius:5px;border:1px solid var(--hidbd);background:var(--btn);color:var(--btnfg);cursor:pointer}
.alist{display:none}
@media (max-width:700px){
header{gap:6px;padding-block:6px}
header b{font-size:13px;width:100%;margin:0}
header button,header select{font-size:13px;padding:5px 8px}
header .stat{font-size:12px}
main{padding-block:10px}
.pgbtn{font-size:11px;padding:2px 6px}
.ans{font-size:9px;padding:0 4px;max-width:none;opacity:.9;left:2%!important;transform:translateY(-110%)}
.ans.hid::before,.ans.show::before{content:attr(data-n)}
.ans span{display:none!important}
.ans.show{background:var(--showbg);border:1px solid var(--red);white-space:nowrap}
.alist{display:flex;flex-direction:column;gap:1px;background:var(--paper);border-top:1px solid var(--hidbd);padding:6px 10px 10px}
.arow{display:flex;gap:8px;align-items:baseline;padding:7px 2px;border-bottom:1px dotted #ccc;font-size:15px;line-height:1.4;cursor:pointer;color:#222}
.arow .q{flex:none;min-width:2.6em;font-weight:700;color:var(--hidfg)}
.arow .t{min-width:0}
.arow.hid .t{color:var(--hidfg);background:var(--hidbg);border:1px dashed var(--hidbd);border-radius:4px;padding:1px 8px;font-size:13px}
.arow.hid .t::before{content:"눌러서 정답 보기"}
.arow.hid .t span{display:none}
.arow.show .t{color:var(--red);font-weight:600}
.arow .ref{font-weight:400;color:var(--refc);font-size:.8em;margin-left:4px}
}
</style>
