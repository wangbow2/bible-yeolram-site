<title>레위기 심화 문제</title>
<style>
:root{--bg:#f3f0ea;--paper:#fffdf8;--fg:#1d1b18;--muted:#6b665d;--bar:#2b2722;--barfg:#f5f1e8;--rule:#d9d3c7;--chip:#dbe4f1;--chipfg:#2f4b78;--chipbd:#7d93b8;--red:#b3120f;--btn:#f4f1ea;--btnfg:#222}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171614;--paper:#211f1c;--fg:#ece7dd;--muted:#a19a8d;--bar:#0e0d0c;--barfg:#eee;--rule:#3a362f;--chip:#26344a;--chipfg:#b9cdf0;--chipbd:#4f6690;--red:#ff7b6e;--btn:#2d2a26;--btnfg:#eee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--paper:#211f1c;--fg:#ece7dd;--muted:#a19a8d;--bar:#0e0d0c;--barfg:#eee;--rule:#3a362f;--chip:#26344a;--chipfg:#b9cdf0;--chipbd:#4f6690;--red:#ff7b6e;--btn:#2d2a26;--btnfg:#eee;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"AppleMyungjo","Nanum Myeongjo","Batang",serif}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barfg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px max(16px,env(safe-area-inset-left,0px));font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header b{font-size:15px;margin-right:6px}
header a{color:var(--barfg);font-size:13px;opacity:.8}
header button,header select{background:var(--btn);color:var(--btnfg);border:0;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}
.stat{margin-left:auto;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.sec{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px;padding:6px 18px 10px}
h2{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px}
.q{padding:12px 0;border-bottom:1px dashed var(--rule)}
.q:last-child{border-bottom:0}
.qt{font-size:17px;line-height:1.6}
.qt b{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;margin-right:6px}
.qt small{color:var(--muted)}
.a{margin-top:8px;display:inline-block;cursor:pointer;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;border-radius:5px;padding:3px 10px;user-select:none}
.a.hid{background:var(--chip);color:var(--chipfg);border:1px dashed var(--chipbd)}
.a.hid::before{content:"눌러서 정답 보기"}
.a.hid span{display:none}
.a.show{color:var(--red);font-weight:600;border:1px solid transparent;padding-left:0}
.a.show::before{content:"▶ "}
.a .r{font-weight:400;color:var(--muted);font-size:.85em;margin-left:6px}
</style>

<script>
const D=[{"n": 1, "q": "번제물을 소로 드릴 때 그 예물은 어떤 것이어야 하며 어디에서 드려야 합니까?", "c": 1, "a": "흠 없는 수컷, 회막 문에서", "r": "레 1:3"}, {"n": 2, "q": "양이나 염소의 번제물은 제단의 어느 쪽 여호와 앞에서 잡아야 합니까?", "c": 1, "a": "제단 북쪽", "r": "레 1:11"}, {"n": 3, "q": "새의 번제를 드릴 때 모이주머니와 더러운 것은 어디에 던집니까?", "c": 1, "a": "제단 동쪽 재 버리는 곳", "r": "레 1:16"}, {"n": 4, "q": "번제물을 불사르기 전에 물로 씻어야 하는 두 부위는 무엇입니까?", "c": 1, "a": "내장과 정강이", "r": "레 1:9"}, {"n": 5, "q": "여호와께 화제로 드려 사르지 못하도록 소제물에 넣지 말라고 한 두 가지는 무엇입니까?", "c": 2, "a": "누룩과 꿀", "r": "레 2:11"}, {"n": 6, "q": "첫 이삭의 소제를 드릴 때 첫 이삭을 어떻게 하여 드립니까?", "c": 2, "a": "볶아 찧은 것으로", "r": "레 2:14"}, {"n": 7, "q": "제사장이 소제물의 고운 가루 한 움큼과 기름과 유향을 가져다가 제단 위에서 불사르는 것을 무엇이라 합니까?", "c": 2, "a": "기념물", "r": "레 2:2"}, {"n": 8, "q": "화목제물로 양을 드릴 때 미골에서 베어 화제로 드리는 것은 무엇입니까?", "c": 3, "a": "기름진 꼬리", "r": "레 3:9"}, {"n": 9, "q": "화목제물을 드릴 때 두 콩팥과 함께 떼어내는 간의 부분은 무엇입니까?", "c": 3, "a": "간에 덮인 꺼풀", "r": "레 3:4"}, {"n": 10, "q": "3장에서 모든 기름은 누구의 것이라고 했습니까?", "c": 3, "a": "여호와의 것", "r": "레 3:16"}, {"n": 11, "q": "기름 부음을 받은 제사장이 범죄했을 때, 속죄제물의 피를 성소의 휘장 앞에 몇 번 뿌립니까?", "c": 4, "a": "일곱 번", "r": "레 4:6"}, {"n": 12, "q": "기름 부음을 받은 제사장의 속죄제에서 회막 안의 어느 제단 뿔들에 피를 바릅니까?", "c": 4, "a": "향단 뿔들", "r": "레 4:7"}, {"n": 13, "q": "족장이 부지중에 범죄했을 때 예물로 가져오는 속죄제물은 무엇입니까?", "c": 4, "a": "흠 없는 숫염소", "r": "레 4:23"}, {"n": 14, "q": "평민이 부지중에 범죄했을 때 염소로 드린다면 어떤 염소를 가져와야 합니까?", "c": 4, "a": "흠 없는 암염소", "r": "레 4:28"}, {"n": 15, "q": "온 회중이 범죄하였을 때 속죄제 수송아지의 머리에 안수하는 사람은 누구입니까?", "c": 4, "a": "회중의 장로들", "r": "레 4:15"}, {"n": 16, "q": "산비둘기 두 마리나 집비둘기 두 마리에도 힘이 미치지 못하는 사람은 속죄제물로 무엇을 가져옵니까?", "c": 5, "a": "고운 가루 십분의 일 에바", "r": "레 5:11"}, {"n": 17, "q": "고운 가루로 드리는 속죄제물에는 무엇을 하지 말아야 합니까?", "c": 5, "a": "기름을 붓지 말고 유향을 놓지 말 것", "r": "레 5:11"}, {"n": 18, "q": "여호와의 성물에 대하여 부지중에 범죄한 자가 잘못을 보상할 때 얼마를 더하여 제사장에게 줍니까?", "c": 5, "a": "오분의 일", "r": "레 5:16"}, {"n": 19, "q": "저주하는 소리를 듣고도 증인이 되어 본 것이나 아는 것을 알리지 아니하면 어떻게 됩니까?", "c": 5, "a": "자기의 죄를 져야 하고 그 허물이 그에게 돌아감", "r": "레 5:1"}, {"n": 20, "q": "이웃의 물건을 속이거나 착취한 자는 본래 물건에 오분의 일을 더하여 언제 그 임자에게 주어야 합니까?", "c": 6, "a": "죄가 드러나는 날", "r": "레 6:5"}, {"n": 21, "q": "제사장은 번제의 재를 진영 밖으로 가져갈 때 무엇을 해야 하며, 재를 어디로 가져갑니까?", "c": 6, "a": "옷을 벗고 다른 옷을 입은 후 진영 바깥 정결한 곳으로", "r": "레 6:11"}, {"n": 22, "q": "6장에서 제단 위의 불에 대하여 무엇이라고 명령하셨습니까?", "c": 6, "a": "항상 피워 꺼지지 않게 하라", "r": "레 6:12-13"}, {"n": 23, "q": "속죄제물의 고기를 삶은 그릇이 토기이면 어떻게 하고, 유기이면 어떻게 합니까?", "c": 6, "a": "토기는 깨뜨리고 유기는 닦고 물에 씻음", "r": "레 6:28"}, {"n": 24, "q": "제사장이 드리는 소제물은 어떻게 처리합니까?", "c": 6, "a": "온전히 불사르고 먹지 않음", "r": "레 6:23"}, {"n": 25, "q": "사람을 위하여 번제를 드린 제사장이 자기 몫으로 가지는 것은 무엇입니까?", "c": 7, "a": "그 번제물의 가죽", "r": "레 7:8"}, {"n": 26, "q": "감사함으로 드리는 화목제물의 고기는 언제 먹어야 합니까?", "c": 7, "a": "드리는 그 날(이튿날 아침까지 두지 말 것)", "r": "레 7:15"}, {"n": 27, "q": "서원이나 자원으로 드린 화목제물의 고기가 셋째 날까지 남으면 어떻게 합니까?", "c": 7, "a": "불사름", "r": "레 7:17"}, {"n": 28, "q": "화목제물 중 여호와 앞에 흔들어 요제로 삼는 부위와, 거제로 제사장에게 주는 부위는 각각 무엇입니까?", "c": 7, "a": "가슴(요제), 오른쪽 뒷다리(거제)", "r": "레 7:30-32"}, {"n": 29, "q": "스스로 죽은 것이나 짐승에게 찢긴 것의 기름은 어떻게 하라고 했습니까?", "c": 7, "a": "다른 데는 쓰되 결단코 먹지는 말 것", "r": "레 7:24"}, {"n": 30, "q": "7장 37절에서 말하는 여섯 가지 규례는 무엇입니까?", "c": 7, "a": "번제, 소제, 속죄제, 속건제, 위임식, 화목제", "r": "레 7:37"}, {"n": 31, "q": "모세가 아론에게 붙인 흉패 안에 넣은 두 가지는 무엇입니까?", "c": 8, "a": "우림과 둠밈", "r": "레 8:8"}, {"n": 32, "q": "아론의 관 위 전면에 붙인 것은 무엇입니까?", "c": 8, "a": "금 패(거룩한 관)", "r": "레 8:9"}, {"n": 33, "q": "모세가 위임식 숫양의 피를 아론의 몸 어느 세 곳에 발랐습니까?", "c": 8, "a": "오른쪽 귓부리, 오른쪽 엄지 손가락, 오른쪽 엄지 발가락", "r": "레 8:23"}, {"n": 34, "q": "위임식에서 잡은 숫양 중 모세의 몫은 무엇이었습니까?", "c": 8, "a": "가슴", "r": "레 8:29"}, {"n": 35, "q": "위임식은 며칠 동안 행하며, 그동안 어디에 나가지 말아야 했습니까?", "c": 8, "a": "이레 동안, 회막 문에 나가지 말아야 함", "r": "레 8:33"}, {"n": 36, "q": "아론이 처음으로 제사를 드렸을 때 제단 위의 번제물과 기름을 사른 것은 무엇입니까?", "c": 9, "a": "여호와 앞에서 나온 불", "r": "레 9:24"}, {"n": 37, "q": "여호와 앞에서 불이 나와 번제물을 사르는 것을 본 백성은 어떻게 했습니까?", "c": 9, "a": "소리 지르며 엎드림", "r": "레 9:24"}, {"n": 38, "q": "제사장 직분을 시작하는 여덟째 날, 아론이 자기를 위한 속죄제로 잡은 것은 무엇입니까?", "c": 9, "a": "송아지", "r": "레 9:2,8"}, {"n": 39, "q": "나답과 아비후의 시체를 진영 밖으로 메고 나간 두 사람은 누구입니까?", "c": 10, "a": "미사엘과 엘사반(아론의 삼촌 웃시엘의 아들들)", "r": "레 10:4"}, {"n": 40, "q": "나답과 아비후의 시체는 어떤 모습으로 진영 밖으로 메어 내졌습니까?", "c": 10, "a": "옷 입은 채", "r": "레 10:5"}, {"n": 41, "q": "제사장들이 회막에 들어갈 때 마시지 말라고 한 것은 무엇입니까?", "c": 10, "a": "포도주나 독주", "r": "레 10:9"}, {"n": 42, "q": "모세가 엘르아살과 이다말에게 노한 까닭은 무엇입니까?", "c": 10, "a": "속죄제 염소를 거룩한 곳에서 먹지 않고 이미 불살랐기 때문", "r": "레 10:16-17"}, {"n": 43, "q": "아론의 대답을 들은 모세는 어떻게 했습니까?", "c": 10, "a": "좋게 여겼다", "r": "레 10:19-20"}, {"n": 44, "q": "낙타와 사반과 토끼가 부정한 이유는 무엇입니까?", "c": 11, "a": "새김질은 하되 굽이 갈라지지 아니하였으므로", "r": "레 11:4-6"}, {"n": 45, "q": "돼지가 부정한 이유는 무엇입니까?", "c": 11, "a": "굽이 갈라져 쪽발이로되 새김질을 못하므로", "r": "레 11:7"}, {"n": 46, "q": "물에 있는 것 중 먹을 수 있는 것의 조건은 무엇입니까?", "c": 11, "a": "지느러미와 비늘이 있는 것", "r": "레 11:9"}, {"n": 47, "q": "날개가 있고 기어 다니는 곤충 중 먹을 수 있는 네 종류는 무엇입니까?", "c": 11, "a": "메뚜기, 베짱이, 귀뚜라미, 팥중이 종류", "r": "레 11:22"}, {"n": 48, "q": "부정한 것의 주검이 질그릇에 떨어지면 그 그릇은 어떻게 합니까?", "c": 11, "a": "깨뜨림", "r": "레 11:33"}, {"n": 49, "q": "부정한 것의 주검이 닿아도 부정하여지지 아니하는 물은 무엇입니까?", "c": 11, "a": "샘물이나 물이 고인 웅덩이", "r": "레 11:36"}, {"n": 50, "q": "11장 45절에서 \"내가 거룩하니 너희도 (     )\" 빈칸에 들어갈 말은?", "c": 11, "a": "거룩할지어다", "r": "레 11:45"}, {"n": 51, "q": "여인이 남자를 낳으면 이레 동안 부정한 후 산혈이 깨끗해지기까지 며칠을 더 지내야 합니까?", "c": 12, "a": "삼십삼 일", "r": "레 12:4"}, {"n": 52, "q": "여인이 여자를 낳으면 부정한 기간과 산혈이 깨끗해지는 기간은 각각 얼마입니까?", "c": 12, "a": "두 이레, 육십육 일", "r": "레 12:5"}, {"n": 53, "q": "정결 기한이 찬 여인이 어린 양을 바칠 힘이 없으면 무엇을 가져옵니까?", "c": 12, "a": "산비둘기 두 마리나 집비둘기 새끼 두 마리", "r": "레 12:8"}, {"n": 54, "q": "나병이 머리부터 발끝까지 전신에 퍼져 다 희어졌으면 제사장은 그를 어떻다고 합니까?", "c": 13, "a": "정하다고 함", "r": "레 13:12-13"}, {"n": 55, "q": "13장에서 정하다고 한 사람이라도 무엇이 보이면 부정하다고 합니까?", "c": 13, "a": "생살", "r": "레 13:14"}, {"n": 56, "q": "머리나 수염에 발생한 나병을 무엇이라고 합니까?", "c": 13, "a": "옴", "r": "레 13:30"}, {"n": 57, "q": "피부에 부유스름한 흰 색점이 생긴 것은 무엇이며, 그는 정합니까 부정합니까?", "c": 13, "a": "어루러기, 정함", "r": "레 13:39"}, {"n": 58, "q": "나병 환자는 옷을 찢고 머리를 풀며 윗입술을 가리고 무엇이라고 외쳐야 합니까?", "c": 13, "a": "부정하다 부정하다", "r": "레 13:45"}, {"n": 59, "q": "병 있는 날 동안 나병 환자는 어디에서 살아야 합니까?", "c": 13, "a": "혼자 진영 밖에서", "r": "레 13:46"}, {"n": 60, "q": "의복의 색점이 날이나 씨나 가죽에 퍼졌으면 무엇이라 하며 그 의복은 어떻게 합니까?", "c": 13, "a": "악성 나병, 불사름", "r": "레 13:51-52"}, {"n": 61, "q": "나병 환자가 정결하게 되는 날, 제사장이 가져오게 하는 네 가지는 무엇입니까?", "c": 14, "a": "살아 있는 정결한 새 두 마리, 백향목, 홍색 실, 우슬초", "r": "레 14:4"}, {"n": 62, "q": "나병 환자의 정결 예식에서 새 하나는 어디에서 잡습니까?", "c": 14, "a": "흐르는 물 위 질그릇 안에서", "r": "레 14:5"}, {"n": 63, "q": "나병 환자의 정결 예식에서 살아 있는 새는 어떻게 합니까?", "c": 14, "a": "들에 놓아 줌", "r": "레 14:7"}, {"n": 64, "q": "정결함을 받는 자는 일곱째 날에 어떤 털들을 밀어야 합니까?", "c": 14, "a": "머리털과 수염과 눈썹(모든 털)", "r": "레 14:9"}, {"n": 65, "q": "정결 예식 여덟째 날 제사장은 한 록의 기름을 어디에 따릅니까?", "c": 14, "a": "자기 왼쪽 손바닥", "r": "레 14:15"}, {"n": 66, "q": "집에 나병 색점이 생겼을 때 제사장이 살펴보러 가기 전에 명령하는 것은 무엇입니까?", "c": 14, "a": "그 집을 비우도록 명령함", "r": "레 14:36"}, {"n": 67, "q": "집 벽의 색점이 퍼졌으면 색점 있는 돌은 어떻게 합니까?", "c": 14, "a": "빼내어 성 밖 부정한 곳에 버림", "r": "레 14:40"}, {"n": 68, "q": "유출병이 있는 자가 만진 질그릇과 나무 그릇은 각각 어떻게 합니까?", "c": 15, "a": "질그릇은 깨뜨리고 나무 그릇은 물로 씻음", "r": "레 15:12"}, {"n": 69, "q": "유출이 깨끗해진 사람은 정결하게 되기 위해 며칠을 센 후 어떤 물에 몸을 씻습니까?", "c": 15, "a": "이레, 흐르는 물", "r": "레 15:13"}, {"n": 70, "q": "15장 31절에서 이스라엘 자손을 부정에서 떠나게 하여 무엇을 더럽히지 않게 하라고 했습니까?", "c": 15, "a": "그들 가운데에 있는 여호와의 성막", "r": "레 15:31"}, {"n": 71, "q": "아론에게 아무 때나 들어오지 말라고 한 곳은 어디입니까?", "c": 16, "a": "성소의 휘장 안 법궤 위 속죄소 앞", "r": "레 16:2"}, {"n": 72, "q": "속죄일에 아론이 입는 거룩한 옷(속옷, 속바지, 띠, 관)은 무엇으로 만든 것입니까?", "c": 16, "a": "세마포", "r": "레 16:4"}, {"n": 73, "q": "두 염소를 위하여 제비 뽑을 때 한 제비는 여호와를 위하고 다른 한 제비는 무엇을 위합니까?", "c": 16, "a": "아사셀", "r": "레 16:8"}, {"n": 74, "q": "아론이 휘장 안에서 분향하여 그 향연으로 가리게 한 것은 무엇입니까?", "c": 16, "a": "증거궤 위 속죄소", "r": "레 16:13"}, {"n": 75, "q": "아론은 수송아지의 피를 속죄소 어느 쪽에 뿌리며, 속죄소 앞에는 몇 번 뿌립니까?", "c": 16, "a": "동쪽, 일곱 번", "r": "레 16:14"}, {"n": 76, "q": "아사셀을 위한 염소를 광야로 보낼 때 누구에게 맡깁니까?", "c": 16, "a": "미리 정한 사람", "r": "레 16:21"}, {"n": 77, "q": "염소가 이스라엘의 모든 불의를 지고 이르는 곳은 어디입니까?", "c": 16, "a": "접근하기 어려운 땅", "r": "레 16:22"}, {"n": 78, "q": "16장 31절에서 속죄일을 무엇이라고 부릅니까?", "c": 16, "a": "안식일 중의 안식일", "r": "레 16:31"}, {"n": 79, "q": "지성소에 들어가 하는 속죄는 일 년에 몇 번 합니까?", "c": 16, "a": "일 년에 한 번", "r": "레 16:34"}, {"n": 80, "q": "짐승을 잡아 회막 문으로 끌고 가서 여호와께 드리지 아니하는 자는 어떤 자로 여겨집니까?", "c": 17, "a": "피 흘린 자", "r": "레 17:4"}, {"n": 81, "q": "이스라엘 자손이 전에 음란하게 섬기며 제사했던 것은 무엇입니까?", "c": 17, "a": "숫염소", "r": "레 17:7"}, {"n": 82, "q": "17장 11절에서 피가 죄를 속하는 이유를 무엇이라 말합니까?", "c": 17, "a": "육체의 생명이 피에 있기 때문", "r": "레 17:11"}, {"n": 83, "q": "먹을 만한 짐승이나 새를 사냥하여 잡으면 그 피는 어떻게 합니까?", "c": 17, "a": "피를 흘리고 흙으로 덮음", "r": "레 17:13"}, {"n": 84, "q": "18장 3절에서 그 풍속을 따르지 말라고 한 두 땅은 어디입니까?", "c": 18, "a": "애굽 땅과 가나안 땅", "r": "레 18:3"}, {"n": 85, "q": "18장 5절에서 사람이 여호와의 규례와 법도를 행하면 어떻게 된다고 했습니까?", "c": 18, "a": "그로 말미암아 살리라", "r": "레 18:5"}, {"n": 86, "q": "자녀를 주어 불로 통과하게 하지 말라고 한 이방 신은 무엇입니까?", "c": 18, "a": "몰렉", "r": "레 18:21"}, {"n": 87, "q": "가증한 일로 땅이 더러워지면 그 땅은 주민을 어떻게 한다고 했습니까?", "c": 18, "a": "토하여 냄", "r": "레 18:25"}, {"n": 88, "q": "품꾼의 삯에 대하여 무엇이라고 명령하셨습니까?", "c": 19, "a": "아침까지 밤새도록 두지 말라", "r": "레 19:13"}, {"n": 89, "q": "귀먹은 자와 맹인에 대하여 무엇을 하지 말라고 했습니까?", "c": 19, "a": "귀먹은 자를 저주하지 말고 맹인 앞에 장애물을 놓지 말라", "r": "레 19:14"}, {"n": 90, "q": "19장 19절에서 섞지 말라고 한 세 가지는 무엇입니까?", "c": 19, "a": "가축을 다른 종류와 교미시키는 것, 밭에 두 종자를 섞어 뿌리는 것, 두 재료로 직조한 옷", "r": "레 19:19"}, {"n": 91, "q": "그 땅에 들어가 과목을 심으면 처음 삼 년 동안의 열매는 어떻게 여겨야 합니까?", "c": 19, "a": "할례 받지 못한 것으로 여겨 먹지 않음", "r": "레 19:23"}, {"n": 92, "q": "노인에 대하여 어떻게 하라고 했습니까?", "c": 19, "a": "센 머리 앞에서 일어서고 노인의 얼굴을 공경하라", "r": "레 19:32"}, {"n": 93, "q": "거류민을 어떻게 대하라고 했습니까?", "c": 19, "a": "너희 중에서 낳은 자 같이 여기며 자기 같이 사랑하라", "r": "레 19:34"}, {"n": 94, "q": "공평하게 사용하라고 한 네 가지는 무엇입니까?", "c": 19, "a": "저울, 추, 에바, 힌", "r": "레 19:36"}, {"n": 95, "q": "자식을 몰렉에게 준 자는 누가 돌로 쳐야 합니까?", "c": 20, "a": "그 지방 사람", "r": "레 20:2"}, {"n": 96, "q": "아내와 그 장모를 함께 데리고 사는 자는 어떻게 합니까?", "c": 20, "a": "그와 그들을 함께 불사름", "r": "레 20:14"}, {"n": 97, "q": "숙모와 동침한 자와 형제의 아내를 데리고 사는 자에게 공통으로 내리는 벌은 무엇입니까?",
