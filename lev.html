<style>
:root{--bg:#f3f0ea;--paper:#fffdf8;--fg:#1d1b18;--muted:#6b665d;--bar:#2b2722;--barfg:#f5f1e8;--rule:#d9d3c7;--chip:#dbe4f1;--chipfg:#2f4b78;--chipbd:#7d93b8;--red:#b3120f;--btn:#f4f1ea;--btnfg:#222}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171614;--paper:#211f1c;--fg:#ece7dd;--muted:#a19a8d;--bar:#0e0d0c;--barfg:#eee;--rule:#3a362f;--chip:#26344a;--chipfg:#b9cdf0;--chipbd:#4f6690;--red:#ff7b6e;--btn:#2d2a26;--btnfg:#eee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--paper:#211f1c;--fg:#ece7dd;--muted:#a19a8d;--bar:#0e0d0c;--barfg:#eee;--rule:#3a362f;--chip:#26344a;--chipfg:#b9cdf0;--chipbd:#4f6690;--red:#ff7b6e;--btn:#2d2a26;--btnfg:#eee;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"AppleMyungjo","Nanum Myeongjo","Batang",serif}
header{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barfg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px max(16px,env(safe-area-inset-left,0px));font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header b{font-size:15px;margin-right:6px}
header a{color:var(--barfg);font-size:13px;opacity:.8}
header button,header select{background:var(--btn);color:var(--btnfg);border:0;border-radius:6px;padding:6px 10px;font-size:14px;cursor:pointer}
.stat{margin-left:auto;font-size:13px;opacity:.85}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.sec{background:var(--paper);border:1px solid var(--rule);border-radius:6px;margin-bottom:16px;padding:6px 18px 10px}
h2{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;letter-spacing:.06em;color:var(--muted);margin:10px 0 2px}
.q{padding:12px 0;border-bottom:1px dashed var(--rule)}
.q:last-child{border-bottom:0}
.qt{font-size:17px;line-height:1.6}
.qt b{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;margin-right:6px}
.qt small{color:var(--muted)}
.a{margin-top:8px;display:inline-block;cursor:pointer;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;border-radius:5px;padding:3px 10px;user-select:none}
.a.hid{background:var(--chip);color:var(--chipfg);border:1px dashed var(--chipbd)}
.a.hid::before{content:"눌러서 정답 보기"}
.a.hid span{display:none}
.a.show{color:var(--red);font-weight:600;border:1px solid transparent;padding-left:0}
.a.show::before{content:"▶ "}
.a .r{font-weight:400;color:var(--muted);font-size:.85em;margin-left:6px}
</style>

<script>
const D=[{"n": 1, "q": "여호와께서 모세를 어디에서 부르시고 말씀하셨습니까?", "c": 1, "a": "회막에서", "r": "레 1:1"}, {"n": 2, "q": "1장 2절에서 예물로 드리라고 한 가축은 무엇입니까?", "c": 1, "a": "소나 양", "r": "레 1:2"}, {"n": 3, "q": "번제물을 소로 드릴 때 그 예물은 어떤 것이어야 하며 어디에서 드려야 합니까?", "c": 1, "a": "흠 없는 수컷, 회막 문에서", "r": "레 1:3"}, {"n": 4, "q": "번제물의 머리에 안수하면 그를 위하여 어떻게 된다고 했습니까?", "c": 1, "a": "기쁘게 받으심이 되어 그를 위하여 속죄가 됨", "r": "레 1:4"}, {"n": 5, "q": "소의 번제에서 피를 가져다가 제단 사방에 뿌리는 사람은 누구입니까?", "c": 1, "a": "아론의 자손 제사장들", "r": "레 1:5"}, {"n": 6, "q": "번제물을 불사르기 전에 물로 씻어야 하는 두 부위는 무엇입니까?", "c": 1, "a": "내장과 정강이", "r": "레 1:9"}, {"n": 7, "q": "양이나 염소의 번제물은 제단의 어느 쪽 여호와 앞에서 잡아야 합니까?", "c": 1, "a": "제단 북쪽", "r": "레 1:11"}, {"n": 8, "q": "새의 번제에서 제사장은 그 머리를 어떻게 하며 피는 어디에 흘립니까?", "c": 1, "a": "머리를 비틀어 끊고, 피는 제단 곁에 흘림", "r": "레 1:15"}, {"n": 9, "q": "새의 번제를 드릴 때 모이주머니와 더러운 것은 어디에 던집니까?", "c": 1, "a": "제단 동쪽 재 버리는 곳", "r": "레 1:16"}, {"n": 10, "q": "새의 번제물은 날개 자리에서 몸을 어떻게 찢습니까?", "c": 1, "a": "찢되 아주 찢지는 않음", "r": "레 1:17"}, {"n": 11, "q": "소제의 예물은 무엇으로 삼으며 그 위에 무엇을 붓고 놓습니까?", "c": 2, "a": "고운 가루, 기름을 붓고 유향을 놓음", "r": "레 2:1"}, {"n": 12, "q": "제사장이 소제물의 고운 가루 한 움큼과 기름과 유향을 가져다가 제단 위에서 불사르는 것을 무엇이라 합니까?", "c": 2, "a": "기념물", "r": "레 2:2"}, {"n": 13, "q": "소제물에서 기념물을 불사르고 남은 것은 누구에게 돌립니까?", "c": 2, "a": "아론과 그의 자손", "r": "레 2:3"}, {"n": 14, "q": "화덕에 구운 것으로 소제를 드릴 때 드릴 수 있는 두 가지는 무엇입니까?", "c": 2, "a": "기름을 섞어 만든 무교병, 기름을 바른 무교전병", "r": "레 2:4"}, {"n": 15, "q": "철판에 부친 소제물은 어떻게 나누고 그 위에 무엇을 붓습니까?", "c": 2, "a": "조각으로 나누고 기름을 부음", "r": "레 2:6"}, {"n": 16, "q": "여호와께 화제로 드려 사르지 못하도록 소제물에 넣지 말라고 한 두 가지는 무엇입니까?", "c": 2, "a": "누룩과 꿀", "r": "레 2:11"}, {"n": 17, "q": "처음 익은 것은 여호와께 드리되 어떻게 하지 말라고 했습니까?", "c": 2, "a": "향기로운 냄새를 위하여 제단에 올리지 말 것", "r": "레 2:12"}, {"n": 18, "q": "소금에 대하여 \"네 모든 (    )에 소금을 드릴지니라\" 빈칸은?", "c": 2, "a": "예물", "r": "레 2:13"}, {"n": 19, "q": "첫 이삭의 소제를 드릴 때 첫 이삭을 어떻게 하여 드립니까?", "c": 2, "a": "볶아 찧은 것으로", "r": "레 2:14"}, {"n": 20, "q": "첫 이삭의 소제에서 제사장이 기념물로 불사르는 것은 무엇입니까?", "c": 2, "a": "찧은 곡식과 기름과 모든 유향", "r": "레 2:16"}, {"n": 21, "q": "화목제물로 소를 드릴 때 수컷만 됩니까?", "c": 3, "a": "수컷이나 암컷이나 흠 없는 것이면 됨", "r": "레 3:1"}, {"n": 22, "q": "화목제물로 드릴 수 있는 세 가지 가축은 무엇입니까?", "c": 3, "a": "소, 양(어린 양), 염소", "r": "레 3:1,6-7,12"}, {"n": 23, "q": "화목제물을 잡는 장소는 어디입니까?", "c": 3, "a": "회막 문(회막 앞)", "r": "레 3:2"}, {"n": 24, "q": "화목제물에서 화제로 드리는 기름 중 내장과 관련된 두 가지는 무엇입니까?", "c": 3, "a": "내장에 덮인 기름과 내장에 붙은 모든 기름", "r": "레 3:3"}, {"n": 25, "q": "화목제물을 드릴 때 두 콩팥과 함께 떼어내는 간의 부분은 무엇입니까?", "c": 3, "a": "간에 덮인 꺼풀", "r": "레 3:4"}, {"n": 26, "q": "화목제의 기름은 무엇 위에서 사릅니까?", "c": 3, "a": "제단 불 위 나무 위의 번제물 위에서", "r": "레 3:5"}, {"n": 27, "q": "화목제물로 양을 드릴 때 미골에서 베어 화제로 드리는 것은 무엇입니까?", "c": 3, "a": "기름진 꼬리", "r": "레 3:9"}, {"n": 28, "q": "3장 11절에서 화목제의 기름을 화제로 드리는 것을 무엇이라고 했습니까?", "c": 3, "a": "여호와께 드리는 음식", "r": "레 3:11"}, {"n": 29, "q": "3장에서 모든 기름은 누구의 것이라고 했습니까?", "c": 3, "a": "여호와의 것", "r": "레 3:16"}, {"n": 30, "q": "3장 17절에서 기름과 피를 먹지 말라는 것은 어떤 규례라고 했습니까?", "c": 3, "a": "모든 처소에서 대대로 지킬 영원한 규례", "r": "레 3:17"}, {"n": 31, "q": "4장의 속죄제는 어떤 죄를 지었을 때 드리는 것입니까?", "c": 4, "a": "여호와의 계명 중 하나라도 그릇(부지중에) 범했을 때", "r": "레 4:2"}, {"n": 32, "q": "기름 부음을 받은 제사장이 범죄했을 때, 속죄제물의 피를 성소의 휘장 앞에 몇 번 뿌립니까?", "c": 4, "a": "일곱 번", "r": "레 4:6"}, {"n": 33, "q": "기름 부음을 받은 제사장의 속죄제에서 회막 안의 어느 제단 뿔들에 피를 바릅니까?", "c": 4, "a": "향단 뿔들", "r": "레 4:7"}, {"n": 34, "q": "제사장의 속죄제에서 남은 피 전부는 어디에 쏟습니까?", "c": 4, "a": "회막 문 앞 번제단 밑", "r": "레 4:7"}, {"n": 35, "q": "제사장의 속죄제 수송아지의 가죽과 고기와 머리와 내장과 똥은 어디에서 불사릅니까?", "c": 4, "a": "진영 바깥 재 버리는 곳(정결한 곳)", "r": "레 4:11-12"}, {"n": 36, "q": "온 회중이 범죄하였을 때 속죄제 수송아지의 머리에 안수하는 사람은 누구입니까?", "c": 4, "a": "회중의 장로들", "r": "레 4:15"}, {"n": 37, "q": "족장이 부지중에 범죄했을 때 예물로 가져오는 속죄제물은 무엇입니까?", "c": 4, "a": "흠 없는 숫염소", "r": "레 4:23"}, {"n": 38, "q": "족장의 속죄제에서 피를 바르는 곳은 어디입니까?", "c": 4, "a": "번제단 뿔들", "r": "레 4:25"}, {"n": 39, "q": "평민이 부지중에 범죄했을 때 염소로 드린다면 어떤 염소를 가져와야 합니까?", "c": 4, "a": "흠 없는 암염소", "r": "레 4:28"}, {"n": 40, "q": "평민이 어린 양을 속죄제물로 가져온다면 어떤 것이어야 합니까?", "c": 4, "a": "흠 없는 암컷", "r": "레 4:32"}, {"n": 41, "q": "저주하는 소리를 듣고도 증인이 되어 본 것이나 아는 것을 알리지 아니하면 어떻게 됩니까?", "c": 5, "a": "자기의 죄를 져야 하고 그 허물이 그에게 돌아감", "r": "레 5:1"}, {"n": 42, "q": "맹세할 때 입술로 무엇을 하면 허물이 됩니까?", "c": 5, "a": "악한 일이든 선한 일이든 하리라고 함부로 말하여 맹세하면", "r": "레 5:4"}, {"n": 43, "q": "5장에서 허물이 있을 때 속죄제를 드리기 전에 먼저 해야 할 일은 무엇입니까?", "c": 5, "a": "잘못하였노라 자복하는 것", "r": "레 5:5"}, {"n": 44, "q": "힘이 어린 양에 미치지 못하는 사람이 비둘기 두 마리를 가져오면 각각 무엇으로 삼습니까?", "c": 5, "a": "하나는 속죄제물, 하나는 번제물", "r": "레 5:7"}, {"n": 45, "q": "비둘기 속죄제물의 남은 피는 어디에 흘립니까?", "c": 5, "a": "제단 밑", "r": "레 5:9"}, {"n": 46, "q": "산비둘기 두 마리나 집비둘기 두 마리에도 힘이 미치지 못하는 사람은 속죄제물로 무엇을 가져옵니까?", "c": 5, "a": "고운 가루 십분의 일 에바", "r": "레 5:11"}, {"n": 47, "q": "고운 가루로 드리는 속죄제물에는 무엇을 하지 말아야 합니까?", "c": 5, "a": "기름을 붓지 말고 유향을 놓지 말 것", "r": "레 5:11"}, {"n": 48, "q": "고운 가루 속죄제물에서 기념물로 불사르고 남은 것은 누구에게 돌립니까?", "c": 5, "a": "제사장", "r": "레 5:13"}, {"n": 49, "q": "속건제로 드리는 숫양은 무엇을 따라 그 가치를 정합니까?", "c": 5, "a": "성소의 세겔(네가 지정한 가치)", "r": "레 5:15"}, {"n": 50, "q": "여호와의 성물에 대하여 부지중에 범죄한 자가 잘못을 보상할 때 얼마를 더하여 제사장에게 줍니까?", "c": 5, "a": "오분의 일", "r": "레 5:16"}, {"n": 51, "q": "이웃의 물건을 속이거나 착취한 자는 본래 물건에 오분의 일을 더하여 언제 그 임자에게 주어야 합니까?", "c": 6, "a": "죄가 드러나는 날", "r": "레 6:5"}, {"n": 52, "q": "번제물은 언제까지 제단 위 석쇠 위에 둡니까?", "c": 6, "a": "아침까지", "r": "레 6:9"}, {"n": 53, "q": "번제의 재를 치울 때 제사장이 입는 옷은 무엇입니까?", "c": 6, "a": "세마포 긴 옷과 세마포 속바지", "r": "레 6:10"}, {"n": 54, "q": "제사장은 번제의 재를 진영 밖으로 가져갈 때 무엇을 해야 하며, 재를 어디로 가져갑니까?", "c": 6, "a": "옷을 벗고 다른 옷을 입은 후 진영 바깥 정결한 곳으로", "r": "레 6:11"}, {"n": 55, "q": "6장에서 제단 위의 불에 대하여 무엇이라고 명령하셨습니까?", "c": 6, "a": "항상 피워 꺼지지 않게 하라", "r": "레 6:12-13"}, {"n": 56, "q": "소제물의 나머지는 어디에서 먹어야 합니까?", "c": 6, "a": "거룩한 곳 회막 뜰", "r": "레 6:16"}, {"n": 57, "q": "아론과 그 자손이 기름 부음을 받는 날에 드리는 소제물의 양과 드리는 때는?", "c": 6, "a": "고운 가루 십분의 일 에바, 절반은 아침에 절반은 저녁에", "r": "레 6:20"}, {"n": 58, "q": "제사장이 드리는 소제물은 어떻게 처리합니까?", "c": 6, "a": "온전히 불사르고 먹지 않음", "r": "레 6:23"}, {"n": 59, "q": "속죄제물의 고기를 삶은 그릇이 토기이면 어떻게 하고, 유기이면 어떻게 합니까?", "c": 6, "a": "토기는 깨뜨리고 유기는 닦고 물에 씻음", "r": "레 6:28"}, {"n": 60, "q": "피를 회막에 가지고 들어가 성소에서 속죄한 속죄제 제물의 고기는 어떻게 합니까?", "c": 6, "a": "먹지 못하고 불사름", "r": "레 6:30"}, {"n": 61, "q": "속죄제와 속건제의 규례는 어떠하다고 했습니까?", "c": 7, "a": "규례가 같음", "r": "레 7:7"}, {"n": 62, "q": "사람을 위하여 번제를 드린 제사장이 자기 몫으로 가지는 것은 무엇입니까?", "c": 7, "a": "그 번제물의 가죽", "r": "레 7:8"}, {"n": 63, "q": "감사제물과 함께 드리는 떡 가운데 누룩을 넣은 떡은 무엇입니까?", "c": 7, "a": "유교병", "r": "레 7:13"}, {"n": 64, "q": "감사함으로 드리는 화목제물의 고기는 언제 먹어야 합니까?", "c": 7, "a": "드리는 그 날(이튿날 아침까지 두지 말 것)", "r": "레 7:15"}, {"n": 65, "q": "서원이나 자원으로 드린 화목제물의 고기가 셋째 날까지 남으면 어떻게 합니까?", "c": 7, "a": "불사름", "r": "레 7:17"}, {"n": 66, "q": "몸이 부정한 자가 화목제물의 고기를 먹으면 어떻게 됩니까?", "c": 7, "a": "자기 백성 중에서 끊어짐", "r": "레 7:20"}, {"n": 67, "q": "스스로 죽은 것이나 짐승에게 찢긴 것의 기름은 어떻게 하라고 했습니까?", "c": 7, "a": "다른 데는 쓰되 결단코 먹지는 말 것", "r": "레 7:24"}, {"n": 68, "q": "화목제물 중 여호와 앞에 흔들어 요제로 삼는 부위와, 거제로 제사장에게 주는 부위는 각각 무엇입니까?", "c": 7, "a": "가슴(요제), 오른쪽 뒷다리(거제)", "r": "레 7:30-32"}, {"n": 69, "q": "7장 37절에서 말하는 여섯 가지 규례는 무엇입니까?", "c": 7, "a": "번제, 소제, 속죄제, 속건제, 위임식, 화목제", "r": "레 7:37"}, {"n": 70, "q": "여호와께서 이 모든 규례를 모세에게 명령하신 장소는 어디입니까?", "c": 7, "a": "시내 산", "r": "레 7:38"}, {"n": 71, "q": "아론과 아들들의 위임식을 위해 모세가 온 회중을 모은 곳은 어디입니까?", "c": 8, "a": "회막 문", "r": "레 8:3-4"}, {"n": 72, "q": "모세가 아론에게 붙인 흉패 안에 넣은 두 가지는 무엇입니까?", "c": 8, "a": "우림과 둠밈", "r": "레 8:8"}, {"n": 73, "q": "아론의 관 위 전면에 붙인 것은 무엇입니까?", "c": 8, "a": "금 패(거룩한 관)", "r": "레 8:9"}, {"n": 74, "q": "모세가 관유를 제단에 몇 번 뿌렸습니까?", "c": 8, "a": "일곱 번", "r": "레 8:11"}, {"n": 75, "q": "모세가 속죄제 수송아지의 피를 제단 네 귀퉁이 뿔에 바른 목적은 무엇입니까?", "c": 8, "a": "제단을 깨끗하게 하고 속하여 거룩하게 하려고", "r": "레 8:15"}, {"n": 76, "q": "모세가 위임식 숫양의 피를 아론의 몸 어느 세 곳에 발랐습니까?", "c": 8, "a": "오른쪽 귓부리, 오른쪽 엄지 손가락, 오른쪽 엄지 발가락", "r": "레 8:23"}, {"n": 77, "q": "위임식에서 잡은 숫양 중 모세의 몫은 무엇이었습니까?", "c": 8, "a": "가슴", "r": "레 8:29"}, {"n": 78, "q": "모세가 아론과 그의 옷, 아들들과 그들의 옷에 뿌린 두 가지는 무엇입니까?", "c": 8, "a": "관유와 제단 위의 피", "r": "레 8:30"}, {"n": 79, "q": "위임식은 며칠 동안 행하며, 그동안 어디에 나가지 말아야 했습니까?", "c": 8, "a": "이레 동안, 회막 문에 나가지 말아야 함", "r": "레 8:33"}, {"n": 80, "q": "위임식 기간 동안 회막 문에 머물러 명령을 지키면 무엇을 면한다고 했습니까?", "c": 8, "a": "사망", "r": "레 8:35"}, {"n": 81, "q": "여덟째 날에 모세가 부른 사람들은 누구입니까?", "c": 9, "a": "아론과 그의 아들들과 이스라엘 장로들", "r": "레 9:1"}, {"n": 82, "q": "제사장 직분을 시작하는 여덟째 날, 아론이 자기를 위한 속죄제로 잡은 것은 무엇입니까?", "c": 9, "a": "송아지", "r": "레 9:2,8"}, {"n": 83, "q": "이스라엘 자손이 속죄제를 위하여 가져와야 했던 것은 무엇입니까?", "c": 9, "a": "숫염소", "r": "레 9:3"}, {"n": 84, "q": "9장 4절에서 그날 이 제사들을 드리라고 한 이유는 무엇입니까?", "c": 9, "a": "오늘 여호와께서 나타나실 것이기 때문", "r": "레 9:4"}, {"n": 85, "q": "아론이 자기를 위한 속죄제를 드릴 때 그 피를 가져온 사람은 누구입니까?", "c": 9, "a": "아론의 아들들", "r": "레 9:9"}, {"n": 86, "q": "아론이 자기를 위한 속죄제물의 고기와 가죽은 어디에서 불살랐습니까?", "c": 9, "a": "진영 밖", "r": "레 9:11"}, {"n": 87, "q": "화목제물의 가슴들과 오른쪽 뒷다리는 어떻게 하였습니까?", "c": 9, "a": "여호와 앞에 요제로 흔듦", "r": "레 9:21"}, {"n": 88, "q": "아론은 제사를 마치고 내려올 때 백성에게 어떻게 하였습니까?", "c": 9, "a": "손을 들어 축복함", "r": "레 9:22"}, {"n": 89, "q": "아론이 처음으로 제사를 드렸을 때 제단 위의 번제물과 기름을 사른 것은 무엇입니까?", "c": 9, "a": "여호와 앞에서 나온 불", "r": "레 9:24"}, {"n": 90, "q": "여호와 앞에서 불이 나와 번제물을 사르는 것을 본 백성은 어떻게 했습니까?", "c": 9, "a": "소리 지르며 엎드림", "r": "레 9:24"}, {"n": 91, "q": "나답과 아비후가 향로에 담아 분향한 것은 무엇이었습니까?", "c": 10, "a": "여호와께서 명령하시지 아니하신 다른 불", "r": "레 10:1"}, {"n": 92, "q": "나답과 아비후의 죽음 앞에서 아론은 어떻게 했습니까?", "c": 10, "a": "잠잠함", "r": "레 10:3"}, {"n": 93, "q": "나답과 아비후의 시체를 진영 밖으로 메고 나간 두 사람은 누구입니까?", "c": 10, "a": "미사엘과 엘사반(아론의 삼촌 웃시엘의 아들들)", "r": "레 10:4"}, {"n": 94, "q": "나답과 아비후의 시체는 어떤 모습으로 진영 밖으로 메어 내졌습니까?", "c": 10, "a": "옷 입은 채", "r": "레 10:5"}, {"n": 95, "q": "모세가 엘르아살과 이다말에게 하지 말라고 한 두 가지 애도 행위는 무엇입니까?", "c": 10, "a": "머리를 풀거나 옷을 찢는 것", "r": "레 10:6"}, {"n": 96, "q": "제사장들이 회막에 들어갈 때 마시지 말라고 한 것은 무엇입니까?", "c": 10, "a": "포도주나 독주", "r": "레 10:9"}, {"n": 97, "q": "제사장이 술을 마시지 않아야 분별할 수 있는 것은 무엇입니까?", "c": 10, "a": "거룩하고 속된 것, 부정하고 정한 것", "r": "레 10:10"}, {"n": 98, "q": "흔든 가슴과 들어올린 뒷다리는 누가 어디에서 먹습니까?", "c": 10, "a": "아론과 그의 자녀가 정결한 곳에서", "r": "레 10:14"}, {"n": 99, "q": "모세가 엘르아살과 이다말에게 노한 까닭은 무엇입니까?", "c": 10, "a": "속죄제 염소를 거룩한 곳에서 먹지 않고 이미 불살랐기 때문", "r": 2:6"}, {"n": 120, "q": "정결 기한이 차면 여인이 속죄제로 가져오는 것은 무엇입니까?", "c": 12, "a": "집비둘기 새끼나 산비둘기", "r": "레 12:6"}, {"n": 121, "q": "출산한 여인은 제물을 누구에게 어디로 가져갑니까?", "c": 12, "a": "회막 문 제사장에게", "r": "레 12:6"}, {"n": 122, "q": "정결 기한이 찬 여인이 어린 양을 바칠 힘이 없으면 무엇을 가져옵니까?", "c": 12, "a": "산비둘기 두 마리나 집비둘기 새끼 두 마리", "r": "레 12:8"}, {"n": 123, "q": "피부에 나병 같은 것이 생기면 누구에게 데리고 갑니까?", "c": 13, "a": "제사장 아론이나 그의 아들 중 한 제사장", "r": "레 13:2"}, {"n": 124, "q": "환부의 털이 희어졌고 환부가 피부보다 우묵하면 무엇이라고 합니까?", "c": 13, "a": "나병의 환부(부정하다)", "r": "레 13:3"}, {"n": 125, "q": "색점이 희나 우묵하지 아니하고 털이 희지 않으면 제사장은 어떻게 합니까?", "c": 13, "a": "이레 동안 가두어 둠", "r": "레 13:4"}, {"n": 126, "q": "피부에 흰 점이 돋고 털이 희어지고 생살이 생긴 것을 무엇이라 합니까?", "c": 13, "a": "피부의 오랜 나병", "r": "레 13:10-11"}, {"n": 127, "q": "나병이 머리부터 발끝까지 전신에 퍼져 다 희어졌으면 제사장은 그를 어떻다고 합니까?", "c": 13, "a": "정하다고 함", "r": "레 13:12-13"}, {"n": 128, "q": "13장에서 정하다고 한 사람이라도 무엇이 보이면 부정하다고 합니까?", "c": 13, "a": "생살", "r": "레 13:14"}, {"n": 129, "q": "종기가 나았던 자리의 색점이 여전하고 퍼지지 않았으면 무엇이라 합니까?", "c": 13, "a": "종기 흔적", "r": "레 13:23"}, {"n": 130, "q": "머리나 수염에 발생한 나병을 무엇이라고 합니까?", "c": 13, "a": "옴", "r": "레 13:30"}, {"n": 131, "q": "옴의 환부에서 무엇이 나면 나은 것으로 봅니까?", "c": 13, "a": "검은 털", "r": "레 13:37"}, {"n": 132, "q": "피부에 부유스름한 흰 색점이 생긴 것은 무엇이며, 그는 정합니까 부정합니까?", "c": 13, "a": "어루러기, 정함", "r": "레 13:39"}, {"n": 133, "q": "머리털이 빠진 사람은 정합니까 부정합니까?", "c": 13, "a": "정함(대머리니 정함)", "r": "레 13:40"}, {"n": 134, "q": "나병 환자는 옷을 찢고 머리를 풀며 윗입술을 가리고 무엇이라고 외쳐야 합니까?", "c": 13, "a": "부정하다 부정하다", "r": "레 13:45"}, {"n": 135, "q": "병 있는 날 동안 나병 환자는 어디에서 살아야 합니까?", "c": 13, "a": "혼자 진영 밖에서", "r": "레 13:46"}, {"n": 136, "q": "의복에 생긴 색점이 나병의 색점인 색깔은 무엇입니까?", "c": 13, "a": "푸르거나 붉은 색", "r": "레 13:49"}, {"n": 137, "q": "의복의 색점이 날이나 씨나 가죽에 퍼졌으면 무엇이라 하며 그 의복은 어떻게 합니까?", "c": 13, "a": "악성 나병, 불사름", "r": "레 13:51-52"}, {"n": 138, "q": "나병 환자가 정결하게 되는 날, 제사장이 가져오게 하는 네 가지는 무엇입니까?", "c": 14, "a": "살아 있는 정결한 새 두 마리, 백향목, 홍색 실, 우슬초", "r": "레 14:4"}, {"n": 139, "q": "나병 환자의 정결 예식에서 새 하나는 어디에서 잡습니까?", "c": 14, "a": " "a": "이레", "r": "레 15:19"}, {"n": 159, "q": "불결기의 여인과 동침하여 그 불결함에 전염되면 며칠 동안 부정합니까?", "c": 15, "a": "이레", "r": "레 15:24"}, {"n": 160, "q": "유출이 그친 여인은 며칠을 센 후에 정하게 됩니까?", "c": 15, "a": "이레", "r": "레 15:28"}, {"n": 161, "q": "15장 31절에서 이스라엘 자손을 부정에서 떠나게 하여 무엇을 더럽히지 않게 하라고 했습니까?", "c": 15, "a": "그들 가운데에 있는 여호와의 성막", "r": "레 15:31"}, {"n": 162, "q": "16장의 말씀은 어떤 사건 이후에 주어졌습니까?", "c": 16, "a": "아론의 두 아들이 여호와 앞에 나아가다가 죽은 후", "r": "레 16:1"}, {"n": 163, "q": "아론에게 아무 때나 들어오지 말라고 한 곳은 어디입니까?", "c": 16, "a": "성소의 휘장 안 법궤 위 속죄소 앞", "r": "레 16:2"}, {"n": 164, "q": "속죄일에 아론이 입는 거룩한 옷(속옷, 속바지, 띠, 관)은 무엇으로 만든 것입니까?", "c": 16, "a": "세마포", "r": "레 16:4"}, {"n": 165, "q": "두 염소를 위하여 제비 뽑을 때 한 제비는 여호와를 위하고 다른 한 제비는 무엇을 위합니까?", "c": 16, "a": "아사셀", "r": "레 16:8"}, {"n": 166, "q": "아론이 휘장 안에서 분향하여 그 향연으로 가리게 한 것은 무엇입니까?", "c": 16, "a": "증거궤 위 속죄소", "r": "레 16:13"}, {"n": 167, "q": "아론은 수송아지의 피를 속죄소 어느 쪽에 뿌리며, 속죄소 앞에는 몇 번 뿌립니까?", "c": 16, "a": "동쪽, 일곱 번", "r": "레 16:14"}, {"n": 168, "q": "아론이 지성소에 속죄하러 들어가서 나오기까지 회막에는 누가 있을 수 있습니까?", "c": 16, "a": "아무도 있지 못함(누구든지 회막에 있지 못함)", "r": "레 16:17"}, {"n": 169, "q": "아사셀을 위한 염소를 광야로 보낼 때 누구에게 맡깁니까?", "c": 16, "a": "미리 정한 사람", "r": "레 16:21"}, {"n": 170, "q": "염소가 이스라엘의 모든 불의를 지고 이르는 곳은 어디입니까?", "c": 16, "a": "접근하기 어려운 땅", "r": "레 16:22"}, {"n": 171, "q": "16장 31절에서 속죄일을 무엇이라고 부릅니까?", "c": 16, "a": "안식일 중의 안식일", "r": "레 16:31"}, {"n": 172, "q": "지성소에 들어가 하는 속죄는 일 년에 몇 번 합니까?", "c": 16, "a": "일 년에 한 번", "r": "레 16:34"}, {"n": 173, "q": "짐승을 잡아 회막 문으로 끌고 가서 여호와께 드리지 아니하는 자는 어떤 자로 여겨집니까?", "c": 17, "a": "피 흘린 자", "r": "레 17:4"}, {"n": 174, "q": "진영 안에서나 진영 밖에서 잡는 짐승을 먼저 어디로 끌고 가야 합니까?", "c": 17, "a": "회막 문(여호와의 성막 앞)", "r": "레 17:4"}, {"n": 175, "q": "들에서 잡던 제물을 회막 문으로 가져와 어떤 제사로 드리라고 했습니까?", "c": 17, "a": "화목제", "r": "레 17:5"}, {"n": 176, "q": "이스라엘 자손이 전에 음란하게 섬기며 제사했던 것은 무엇입니까?", "c": 17, "a": "숫염소", "r": "레 17:7"}, {"n": 177, "q": "무슨 피든지 먹는 자에게 여호와께서 무엇을 하겠다고 하셨습니까?", "c": 17, "a": "얼굴을 대하여 그를 백성 중에서 끊음", "r": "레 17:10"}, {"n": 178, "q": "17장 11절에서 피가 죄를 속하는 이유를 무엇이라 말합니까?", "c": 17, "a": "육체의 생명이 피에 있기 때문", "r": "레 17:11"}, {"n": 179, "q": "피를 먹지 말라는 명령은 이스라엘 자손 외에 누구에게도 적용됩니까?", "c": 17, "a": "그들 중에 거류하는 거류민", "r": "레 17:12"}, {"n": 180, "q": "먹을 만한 짐승이나 새를 사냥하여 잡으면 그 피는 어떻게 합니까?", "c": 17, "a": "피를 흘리고 흙으로 덮음", "r": "레 17:13"}, {"n": 181, "q": "17장 14절에서 모든 생물의 피는 무엇과 일체라고 했습니까?", "c": 17, "a": "생명", "r": "레 17:14"}, {"n": 182, "q": "스스로 죽은 것을 먹고도 옷을 빨지 않고 몸을 씻지 아니하면 어떻게 됩니까?", "c": 17, "a": "죄를 담당함", "r": "레 17:16"}, {"n": 183, "q": "18장 2절에서 이스라엘 자손에게 먼저 선포하신 말씀은 무엇입니까?", "c": 18, "a": "나는 여호와 너희의 하나님이니라", "r": "레 18:2"}, {"n": 184, "q": "18장 3절에서 그 풍속을 따르지 말라고 한 두 땅은 어디입니까?", "c": 18, "a": "애굽 땅과 가나안 땅", "r": "레 18:3"}, {"n": 185, "q": "18장 5절에서 사람이 여호와의 규례와 법도를 행하면 어떻게 된다고 했습니까?", "c": 18, "a": "그로 말미암아 살리라", "r": "레 18:5"}, {"n": 186, "q": "18장 6절에서 가까이 하여 하체를 범하지 말라고 한 대상은 누구입니까?", "c": 18, "a": "자기의 살붙이", "r": "레 18:6"}, {"n": 187, "q": "아내가 생존할 동안에 그의 자매를 데려다가 하체를 범하지 말라는 이유는 무엇입니까?", "c": 18, "a": "아내로 질투하게 하지 않으려고", "r": "레 18:18"}, {"n": 188, "q": "자녀를 주어 불로 통과하게 하지 말라고 한 이방 신은 무엇입니까?", "c": 18, "a": "몰렉", "r": "레 18:21"}, {"n": 189, "q": "짐승과 교합하는 일을 무엇이라고 했습니까?", "c": 18, "a": "문란한 일", "r": "레 18:23"}, {"n": 190, "q": "가나안 족속들이 쫓겨나는 이유는 무엇이라고 했습니까?", "c": 18, "a": "이 모든 일(가증한 일)로 더러워졌기 때문", "r": "레 18:24"}, {"n": 191, "q": "가증한 일로 땅이 더러워지면 그 땅은 주민을 어떻게 한다고 했습니까?", "c": 18, "a": "토하여 냄", "r": "레 18:25"}, {"n": 192, "q": "가증한 모든 일을 행하는 자는 어떻게 됩니까?", "c": 18, "a": "그 백성 중에서 끊어짐", "r": "레 18:29"}, {"n": 193, "q": "19장 2절에서 이스라엘 온 회중에게 거룩하라고 하신 이유는 무엇입니까?", "c": 19, "a": "여호와 하나님이 거룩하기 때문", "r": "레 19:2"}, {"n": 194, "q": "19장 3절에서 각 사람이 지킬 두 가지는 무엇입니까?", "c": 19, "a": "부모를 경외하고 안식일을 지키는 것", "r": "레 19:3"}, {"n": 195, "q": "품꾼의 삯에 대하여 무엇이라고 명령하셨습니까?", "c": 19, "a": "아침까지 밤새도록 두지 말라", "r": "레 19:13"}, {"n": 196, "q": "귀먹은 자와 맹인에 대하여 무엇을 하지 말라고 했습니까?", "c": 19, "a": "귀먹은 자를 저주하지 말고 맹인 앞에 장애물을 놓지 말라", "r": "레 19:14"}, {"n": 197, "q": "재판할 때 가난한 자와 세력 있는 자에 대하여 어떻게 하라고 했습니까?", "c": 19, "a": "가난한 자의 편을 들지 말고 세력 있는 자라고 두둔하지 말고 공의로 재판함", "r": "레 19:15"}, {"n": 198, "q": "19장 19절에서 섞지 말라고 한 세 가지는 무엇입니까?", "c": 19, "a": "가축을 다른 종류와 교미시키는 것, 밭에 두 종자를 섞어 뿌리는 것, 두 재료로 직조한 옷", "r": "레 19:19"}, {"n": 199, "q": "그 땅에 들어가 과목을 심으면 처음 삼 년 동안의 열매는 어떻게 여겨야 합니까?", "c": 19, "a": "할례 받지 못한 것으로 여겨 먹지 않음", "r": "레 19:23"}, {"n": 200, "q": "노인에 대하여 어떻게 하라고 했습니까?", "c": 19, "a": "센 머리 앞에서 일어서고 노인의 얼굴을 공경하라", "r": "레 19:32"}, {"n": 201, "q": "거류민을 어떻게 대하라고 했습니까?", "c": 19, "a": "너희 중에서 낳은 자 같이 여기며 자기 같이 사랑하라", "r": "레 19:34"}, {"n": 202, "q": "공평하게 사용하라고 한 네 가지는 무엇입니까?", "c": 19, "a": "저울, 추, 에바, 힌", "r": "레 19:36"}, {"n": 203, "q": "자식을 몰렉에게 준 자는 누가 돌로 쳐야 합니까?", "c": 20, "a": "그 지방 사람", "r": "레 20:2"}, {"n": 204, "q": "접신한 자와 박수무당을 음란하게 따르는 자에게 여호와께서 어떻게 하십니까?", "c": 20, "a": "진노하여 그를 백성 중에서 끊으심", "r": "레 20:6"}, {"n": 205, "q": "20장 8절에서 여호와께서 자신을 무엇이라 소개하셨습니까?", "c": 20, "a": "너희를 거룩하게 하는 여호와", "r": "레 20:8"}, {"n": 206, "q": "자기의 아버지나 어머니를 저주하는 자는 어떻게 합니까?", "c": 20, "a": "반드시 죽임", "r": "레 20:9"}, {"n": 207, "q": "이웃의 아내와 간음한 자에 대한 처벌은 무엇입니까?", "c": 20, "a": "간부와 음부를 반드시 죽임", "r": "레 20:10"}, {"n": 208, "q": "아내와 그 장모를 함께 데리고 사는 자는 어떻게 합니까?", "c": 20, "a": "그와 그들을 함께 불사름", "r": "레 20:14"}, {"n": 209, "q": "숙모와 동침한 자와 형제의 아내를 데리고 사는 자에게 공통으로 내리는 벌은 무엇입니까?", "c": 20, "a": "자식이 없음", "r": "레 20:20-21"}, {"n": 210, "q": "20장 24절에서 이스라엘에게 주실 땅을 무엇이라고 표현했습니까?", "c": 20, "a": "젖과 꿀이 흐르는 땅", "r": "레 20:24"}, {"n": 211, "q": "20장 26절에서 여호와께서 이스라엘을 만민 중에서 구별하신 목적은 무엇입니까?", "c": 20, "a": "나의 소유로 삼으려고", "r": "레 20:26"}, {"n": 212, "q": "접신하거나 박수무당이 된 남자나 여자는 어떻게 처벌합니까?", "c": 20, "a": "돌로 쳐 죽임", "r": "레 20:27"}, {"n": 213, "q": "제사장이 시체로 말미암아 몸을 더럽힐 수 있는 살붙이는 누구입니까?", "c": 21, "a": "어머니, 아버지, 아들, 딸, 형제, 출가하지 아니한 처녀인 자매", "r": "레 21:2-3"}, {"n": 214, "q": "제사장에게 시체로 몸을 더럽히지 말라고 하며 제사장을 무엇이라고 불렀습니까?", "c": 21, "a": "그의 백성의 어른", "r": "레 21:4"}, {"n": 215, "q": "제사장이 하지 말아야 할 세 가지 외모 관련 행동은 무엇입니까?", "c": 21, "a": "머리털을 깎아 대머리 같게 하는 것, 수염 양쪽을 깎는 것, 살을 베는 것", "r": "레 21:5"}, {"n": 216, "q": "제사장이 아내로 취하지 말아야 할 여인은 누구입니까?", "c": 21, "a": "부정한 창녀나 이혼 당한 여인", "r": "레 21:7"}, {"n": 217, "q": "제사장의 딸이 행음하여 자신을 속되게 하면 어떻게 합니까?", "c": 21, "a": "불사름", "r": "레 21:9"}, {"n": 218, "q": "대제사장은 부모가 죽었을 때도 어떻게 해야 합니까?", "c": 21, "a": "시체에 가까이 하지 말고 더러워지지 말아야 함", "r": "레 21:11"}, {"n": 219, "q": "대제사장이 머리를 풀거나 옷을 찢지 말아야 하는 근거로, 그 위에 무엇이 있다고 했습니까?", "c": 21, "a": "하나님께서 성별하신 관유", "r": "레 21:12"}, {"n": 220, "q": "대제사장이 아내로 삼을 수 있는 여자는 누구입니까?", "c": 21, "a": "자기 백성 중의 처녀", "r": "레 21:13-14"}, {"n": 221, "q": "21장 18절에서 흠 있는 자로 처음 열거된 두 사람은 누구입니까?", "c": 21, "a": "맹인과 다리 저는 자", "r": "레 21:18"}, {"n": 222, "q": "육체에 흠이 있는 아론의 자손은 성물을 먹을 수는 있지만 무엇을 하지 못합니까?", "c": 21, "a": "휘장 안에 들어가거나 제단에 가까이 하지 못함", "r": "레 21:22-23"}, {"n": 223, "q": "시체의 부정 등에 접촉된 제사장은 언제 성물을 먹을 수 있습니까?", "c": 22, "a": "몸을 물로 씻고 해 질 때에야", "r": "레 22:6-7"}, {"n": 224, "q": "제사장의 객이나 품꾼은 성물을 먹을 수 있습니까?", "c": 22, "a": "먹지 못함", "r": "레 22:10"}, {"n": 225, "q": "제사장이 돈으로 산 사람과 그의 집에서 출생한 자는 성물을 먹을 수 있습니까?", "c": 22, "a": "먹을 수 있음", "r": "레 22:11"}, {"n": 226, "q": "제사장의 딸이 일반인에게 출가하였다가 과부가 되거나 이혼을 당하여 자식 없이 친정에 돌아오면 어떻게 됩니까?", "c": 22, "a": "아버지 몫의 음식(성물)을 먹을 수 있음", "r": "레 22:13"}, {"n": 227, "q": "누가 부지중에 성물을 먹으면 어떻게 해야 합니까?", "c": 22, "a": "그 성물에 오분의 일을 더하여 제사장에게 줌", "r": "레 22:14"}, {"n": 228, "q": "서원제물이나 자원제물로 번제를 드릴 때 어떤 것으로 드려야 합니까?", "c": 22, "a": "소나 양이나 염소의 흠 없는 수컷", "r": "레 22:19"}, {"n": 229, "q": "지체가 더하거나 덜한 소나 양은 어떤 제물로는 쓸 수 있고 어떤 제물로는 쓸 수 없습니까?", "c": 22, "a": "자원제물로는 쓸 수 있으나 서원제물로는 기쁘게 받으심이 되지 못함", "r": "레 22:23"}, {"n": 230, "q": "수소나 양이나 염소가 나면 며칠 동안 어미와 같이 있게 해야 합니까?", "c": 22, "a": "이레 동안", "r": "레 22:27"}, {"n": 231, "q": "같은 날에 잡지 말라고 한 것은 무엇입니까?", "c": 22, "a": "어미와 새끼", "r": "레 22:28"}, {"n": 232, "q": "감사제물의 고기는 언제까지 먹어야 합니까?", "c": 22, "a": "그 날에 먹고 이튿날까지 두지 말 것", "r": "레 22:30"}, {"n": 233, "q": "안식일은 어떤 날이라고 했습니까?", "c": 23, "a": "쉴 안식일이니 성회의 날", "r": "레 23:3"}, {"n": 234, "q": "여호와의 유월절은 언제입니까?", "c": 23, "a": "첫째 달 열나흗날 저녁", "r": "레 23:5"}, {"n": 235, "q": "무교절은 언제이며 며칠 동안 무교병을 먹습니까?", "c": 23, "a": "첫째 달 열닷샛날, 이레 동안", "r": "레 23:6"}, {"n": 236, "q": "첫 이삭 한 단은 언제 여호와 앞에 흔듭니까?", "c": 23, "a": "안식일 이튿날", "r": "레 23:11"}, {"n": 237, "q": "첫 이삭을 드리는 날까지 먹지 말라고 한 세 가지는 무엇입니까?", "c": 23, "a": "떡, 볶은 곡식, 생 이삭", "r": "레 23:14"}, {"n": 238, "q": "곡식단을 흔든 날부터 새 소제를 드릴 때까지 며칠을 계수합니까?", "c": 23, "a": "오십 일", "r": "레 23:16"}, {"n": 239, "q": "곡식단을 가져온 날부터 오십 일을 계수하여 드리는 떡 두 개는 어떻게 만든 것입니까?", "c": 23, "a": "고운 가루에 누룩을 넣어서 구운 것", "r": "레 23:17"}, {"n": 240, "q": "나팔을 불어 기념할 날은 언제입니까?", "c": 23, "a": "일곱째 달 첫 날", "r": "레 23:24"}, {"n": 241, "q": "속죄일의 안식은 언제부터 언제까지 지킵니까?", "c": 23, "a": "그 달 아흐렛날 저녁부터 이튿날 저녁까지", "r": "레 23:32"}, {"n": 242, "q": "초막절은 언제이며 며칠 동안 지킵니까?", "c": 23, "a": "일곱째 달 열닷샛날, 이레 동안", "r": "레 23:34"}, {"n": 243, "q": "초막절 첫 날에 취하는 네 가지는 무엇입니까?", "c": 23, "a": "아름다운 나무 실과, 종려나무 가지, 무성한 나무 가지, 시내 버들", "r": "레 23:40"}, {"n": 244, "q": "초막에 이레 동안 거주하게 하신 이유는 무엇입니까?", "c": 23, "a": "애굽에서 인도하여 내던 때에 초막에 거주하게 한 것을 대대로 알게 하려고", "r": "레 23:43"}, {"n": 245, "q": "등잔불을 켜기 위해 가져오게 한 기름은 무엇입니까?", "c": 24, "a": "감람을 찧어낸 순결한 기름", "r": "레 24:2"}, {"n": 246, "q": "등잔불은 언제부터 언제까지 정리합니까?", "c": 24, "a": "저녁부터 아침까지", "r": "레 24:3"}, {"n": 247, "q": "진설하는 떡은 몇 개이며 어떻게 놓습니까?", "c": 24, "a": "열두 개, 두 줄로 한 줄에 여섯씩", "r": "레 24:5-6"}, {"n": 248, "q": "진설병 각 줄 위에 두어 기념물로 삼는 것은 무엇입니까?", "c": 24, "a": "정결한 유향", "r": "레 24:7"}, {"n": 249, "q": "진설병은 언제마다 여호와 앞에 진설합니까?", "c": 24, "a": "안식일마다", "r": "레 24:8"}, {"n": 250, "q": "진설병은 누가 어디에서 먹습니까?", "c": 24, "a": "아론과 그의 자손이 거룩한 곳에서", "r": "레 24:9"}, {"n": 251, "q": "여호와의 이름을 모독한 사람의 아버지는 어느 나라 사람이었습니까?", "c": 24, "a": "애굽 사람", "r": "레 24:10"}, {"n": 252, "q": "여호와의 이름을 모독한 사람의 어머니는 누구이며 어느 지파 누구의 딸입니까?", "c": 24, "a": "슬로밋, 단 지파 디브리의 딸", "r": "레 24:11"}, {"n": 253, "q": "그 저주한 사람을 돌로 치기 전에 그것을 들은 모든 사람이 무엇을 하였습니까?", "c": 24, "a": "손을 그의 머리에 얹음", "r": "레 24:14"}, {"n": 254, "q": "24장 20절에서 남에게 상해를 입힌 자에게 어떻게 갚으라고 했습니까?", "c": 24, "a": "상처에는 상처로, 눈에는 눈으로, 이에는 이로", "r": "레 24:20"}, {"n": 255, "q": "24장 22절에서 이 법을 누구에게든지 동일하게 하라고 했습니까?", "c": 24, "a": "거류민에게든지 본토인에게든지", "r": "레 24:22"}, {"n": 256, "q": "여호와께서 25장의 말씀을 어디에서 모세에게 하셨습니까?", "c": 25, "a": "시내 산", "r": "레 25:1"}, {"n": 257, "q": "안식년의 소출은 누가 먹을 수 있습니까?", "c": 25, "a": "너와 남종, 여종, 품꾼, 거류하는 자, 가축과 들짐승", "r": "레 25:6-7"}, {"n": 258, "q": "일곱 안식년을 계수하면 모두 몇 년입니까?", "c": 25, "a": "사십구 년", "r": "레 25:8"}, {"n": 259, "q": "희년을 알리는 뿔나팔은 어느 날에 붑니까?", "c": 25, "a": "일곱째 달 열흘날(속죄일)", "r": "레 25:9"}, {"n": 260, "q": "희년에 각 사람은 어디로 돌아갑니까?", "c": 25, "a": "자기의 소유지와 자기의 가족에게로", "r": "레 25:10"}, {"n": 261, "q": "희년에 하지 말라고 한 것 세 가지는 무엇입니까?", "c": 25, "a": "파종, 스스로 난 것을 거둠, 가꾸지 아니한 포도를 거둠", "r": "레 25:11"}, {"n": 262, "q": "희년까지 남은 연수가 많으면 땅값을 어떻게 매깁니까?", "c": 25, "a": "많이 매김", "r": "레 25:16"}, {"n": 263, "q": "안식년을 염려하는 백성에게 여섯째 해의 소출을 몇 년 동안 쓰기에 족하게 하겠다고 하셨습니까?", "c": 25, "a": "삼 년", "r": "레 25:21"}, {"n": 264, "q": "가난하여 기업을 판 형제를 위하여 그것을 무를 사람은 누구입니까?", "c": 25, "a": "가까운 기업 무를 자", "r": "레 25:25"}, {"n": 265, "q": "성벽 있는 성 내의 가옥을 팔았으면 언제까지 무를 수 있습니까?", "c": 25, "a": "판 지 만 일 년 안", "r": "레 25:29"}, {"n": 266, "q": "성벽 있는 성 내의 가옥을 일 년 안에 무르지 못하면 어떻게 됩니까?", "c": 25, "a": "산 자의 소유로 영구히 확정되고 희년에도 돌려보내지 않음", "r": "레 25:30"}, {"n": 267, "q": "레위 사람의 성읍 주위에 있는 들판은 어떻게 하라고 했습니까?", "c": 25, "a": "영원한 소유지이니 팔지 못함", "r": "레 25:34"}, {"n": 268, "q": "가난하게 된 형제에게 받지 말라고 한 것은 무엇입니까?", "c": 25, "a": "이자", "r": "레 25:36"}, {"n": 269, "q": "몸이 팔린 가난한 형제를 어떻게 대하라고 했습니까?", "c": 25, "a": "종으로 부리지 말고 품꾼이나 동거인과 같이 대함", "r": "레 25:39-40"}, {"n": 270, "q": "이스라엘 자손을 종으로 팔지 말라고 하신 이유는 무엇입니까?", "c": 25, "a": "여호와께서 애굽에서 인도하여 낸 여호와의 종들이기 때문", "r": "레 25:42"}, {"n": 271, "q": "26장 1절에서 세우지 말라고 한 것은 무엇입니까?", "c": 26, "a": "우상, 조각한 것, 주상, 조각한 석상", "r": "레 26:1"}, {"n": 272, "q": "순종하면 여호와께서 무엇을 철따라 주신다고 했습니까?", "c": 26, "a": "비", "r": "레 26:4"}, {"n": 273, "q": "26장 5절에서 타작은 언제까지 미친다고 했습니까?", "c": 26, "a": "포도 딸 때까지", "r": "레 26:5"}, {"n": 274, "q": "26장 8절에서 \"너희 다섯이 백을 쫓고 너희 백이 (   )을 쫓으리니\" 빈칸은?", "c": 26, "a": "만", "r": "레 26:8"}, {"n": 275, "q": "26장 12절에서 여호와 const m=document.getElementById('m');let sec=null,cur=0;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
D.forEach(d=>{if(d.c!==cur){cur=d.c;sec=document.createElement('section');sec.className='sec';sec.id='c'+d.c;sec.innerHTML='<h2>레위기 '+d.c+'장</h2>';m.appendChild(sec)}
 const q=document.createElement('div');q.className='q';
 q.innerHTML='<div class="qt"><b>'+d.n+'.</b>'+esc(d.q)+' <small>('+d.c+'장)</small></div><div class="a hid"><span>'+esc(d.a)+'<span class="r">('+d.r+')</span></span></div>';
 const a=q.querySelector('.a');a.onclick=()=>{set(a,a.classList.contains('hid'));stat()};sec.appendChild(q)});
function set(e,s){e.classList.toggle('hid',!s);e.classList.toggle('show',s)}
function stat(){document.getElementById('stat').textContent='정답 공개 '+document.querySelectorAll('.a.show').length+' / '+D.length}
document.getElementById('hideAll').onclick=()=>{document.querySelectorAll('.a').forEach(e=>set(e,false));stat()};
document.getElementById('showAll').onclick=()=>{document.querySelectorAll('.a').forEach(e=>set(e,true));stat()};
document.getElementById('jump').onchange=e=>{if(e.target.value)document.getElementById(e.target.value).scrollIntoView()};
stat();
</script>
